2);outline-offset:2px}textarea,input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:0 0 8px}.field{width:100%;padding:13px}.result{margin-top:14px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--border)}.result strong{font-size:28px;letter-spacing:-.03em}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.stat b{display:block;font-size:22px;letter-spacing:-.03em}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:650}.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}.symbol-grid{display:flex;flex-wrap:wrap;gap:9px}.symbol{min-width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.swatch{height:92px;border-radius:16px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:9px;font-size:12px;font-weight:750;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tab.active{background:var(--accentSoft);border-color:rgba(99,91,255,.25);color:var(--accent)}.drop{border:1.5px dashed #cfcfd8;border-radius:18px;padding:35px 18px;text-align:center;background:var(--surface2)}.drop input{display:none}.small{font-size:13px}.mono{font-family:ui-monospace,SFMono-Re .expression-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px}.expression{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:92px;padding:18px;border:1px solid var(--border);border-radius:18px;background:var(--surface2);overflow-x:auto}.fraction-box{display:inline-flex;flex-direction:column;align-items:stretch;width:92px;min-width:92px}.fraction-input{width:100%;height:38px;padding:7px 9px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font-size:18px;text-align:center}.fraction-input.top{border-bottom-left-radius:4px;border-bottom-right-radius:4px;border-bottom-color:var(--text)}.fraction-input.bottom{border-top-left-radius:4px;border-top-right-radius:4px}.operator-wrap{display:inline-flex;align-items:center;justify-content:center;min-width:38px}.operator{width:38px;height:38px;padding:0;text-align:center;border-radius:10px;font-weight:800}.term-remove{width:28px;height:28px;padding:0;border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:8px;line-height:1}.term-remove:hover{background:var(--surface);color:var(--text)}.expression-controls{margin-top:16px;margin-bottom:0}.expression .fraction-wrap{display:flex;align-items:center;gap:5px}@media(max-width:760px){.expression-head{align-items:flex-start;flex-direction:column}.expression{padding:14px}.fraction-box{width:82px;min-width:82px}.operator-wrap{min-width:32px}.operator{width:32px}}

.history-card{margin-top:16px;padding:18px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.history-title{font-size:16px;font-weight:800;letter-spacing:-.02em}.history-list{display:grid;gap:10px;max-height:320px;overflow-y:auto;padding-right:4px}.history-empty{padding:18px;border:1px dashed #cfcfd8;border-radius:16px;color:var(--muted);font-size:13px;text-align:center}.history-item{padding:11px 13px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.history-equation{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:15px;word-break:break-word}.history-answer{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-top:7px}.history-answer strong{font-size:18px;letter-spacing:-.02em}.history-answer .mixed-form{color:var(--muted);font-size:13px}.history-meta{margin-top:6px;color:var(--muted);font-size:11px}

<body>
<div class="shell">
<header class="site-header">
  <a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewBox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a>
  <a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a>
</header>
<section class="hero"><h1>Decimal to Fraction</h1></section>
<main class="card tool-card">
  <div class="decimal-field-wrap">
    <label class="label" for="decimalInput">Decimal</label>
    <input class="field" id="decimalInput" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="e.g. 0.125" aria-describedby="decimal-help" />
    <div class="field-help" id="decimal-help">Enter a terminating decimal, such as 0.125, 2.75, or −0.4.</div>
  </div>
  <div class="controls" style="margin-top:18px;margin-bottom:0">
    <button class="btn primary" id="convertButton" type="button">Convert</button>
    <button class="btn" id="clearInput" type="button">Clear input</button>
  </div>
  <div class="result" id="result" aria-live="polite" aria-atomic="true"><div class="muted small">Enter a decimal to convert it.</div></div>
  <div class="small error-text" id="error" role="alert" style="display:none;margin-top:10px"></div>
</main>
<section aria-labelledby="historyTitle" class="card history-card">
  <div class="history-head"><div class="history-title" id="historyTitle">History</div><button class="btn" id="clearHistory" type="button">Clear all history</button></div>
  <div class="history-list" id="historyList"><div class="history-empty">No calculations yet.</div></div>
</section>
</div>
<script>
(() => {
  'use strict';
  const HISTORY_KEY = 'toolsEtc_decimalToFraction_history_v1';
  const MAX_HISTORY = 50;
  const input = document.getElementById('decimalInput');
  const result = document.getElementById('result');
  const error = document.getElementById('error');
  const historyList = document.getElementById('historyList');

  const gcd = (a, b) => {
    a = a < 0n ? -a : a;
    b = b < 0n ? -b : b;
    while (b !== 0n) { const r = a % b; a = b; b = r; }
    return a || 1n;
  };
  const simplify = (n, d) => {
    if (d < 0n) { n = -n; d = -d; }
    const g = gcd(n, d);
    return [n / g, d / g];
  };
  const formatFraction = (n, d) => d === 1n ? String(n) : `${n}/${d}`;
  const formatMixed = (n, d) => {
    if (d === 1n || n === 0n) return String(n);
    const negative = n < 0n;
    const absolute = negative ? -n : n;
    const whole = absolute / d;
    const remainder = absolute % d;
    if (whole === 0n) return `${negative ? '-' : ''}${remainder}/${d}`;
    if (remainder === 0n) return `${negative ? '-' : ''}${whole}`;
    return `${negative ? '-' : ''}${whole} ${remainder}/${d}`;
  };
  function showError(message = '') {
    error.textContent = message;
    error.style.display = message ? 'block' : 'none';
  }
  function loadHistory() {
    try {
      const parsed = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      return Array.isArray(parsed) ? parsed.slice(0, MAX_HISTORY).filter(item => item && typeof item.decimal === 'string' && typeof item.fraction === 'string') : [];
    } catch { return []; }
  }
  let history = loadHistory();
  function saveHistory() {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, MAX_HISTORY))); } catch {}
  }
  function appendText(parent, tag, className, text) {
    const el = document.createElement(tag);
    if (className) el.className = className;
    el.textContent = text;
    parent.appendChild(el);
    return el;
  }
  function renderHistory() {
    historyList.replaceChildren();
    if (!history.length) {
      appendText(historyList, 'div', 'history-empty', 'No calculations yet.');
      return;
    }
    for (const item of history) {
      const row = document.createElement('div'); row.className = 'history-item';
      appendText(row, 'div', 'history-equation', item.decimal);
      const answer = document.createElement('div'); answer.className = 'history-answer';
      appendText(answer, 'strong', '', item.fraction);
      if (item.mixed && item.mixed !== item.fraction) appendText(answer, 'span', 'mixed-form', `Mixed: ${item.mixed}`);
      row.appendChild(answer);
      if (item.time) appendText(row, 'div', 'history-meta', item.time);
      historyList.appendChild(row);
    }
  }
  function parseDecimal(value) {
    const s = value.trim().replace(/[−–—]/g, '-');
    const match = s.match(/^([+-]?)(?:(\d+)(?:\.(\d*))?|\.(\d+))$/);
    if (!match) throw new Error('Enter a decimal using digits and an optional decimal point, such as 0.375.');
    const whole = match[2] || '0';
    const fraction = match[3] !== undefined ? match[3] : (match[4] || '');
    if (whole.length + fraction.length > 100) throw new Error('Please use no more than 100 digits in one number.');
    const digitString = (whole + fraction).replace(/^0+(?=\d)/, '') || '0';
    let numerator = BigInt(digitString);
    if (match[1] === '-') numerator = -numerator;
    const denominator = 10n ** BigInt(fraction.length);
    return simplify(numerator, denominator);
  }
  function convert() {
    if (!input.value.trim()) {
      showError('Enter a decimal first.');
      result.replaceChildren(); appendText(result, 'div', 'muted small', 'Enter a decimal to convert it.');
      input.focus(); return;
    }
    try {
      const [n, d] = parseDecimal(input.value);
      const fraction = formatFraction(n, d);
      const mixed = formatMixed(n, d);
      result.replaceChildren();
      appendText(result, 'strong', 'fraction-large', fraction);
      appendText(result, 'div', 'fraction-subtitle', d === 1n ? 'Whole number' : 'Simplified fraction');
      if (mixed !== fraction) {
        const details = document.createElement('div'); details.className = 'result-detail';
        const line = document.createElement('div'); line.className = 'form-line';
        appendText(line, 'span', 'form-label', 'Mixed number');
        appendText(line, 'span', 'form-value', mixed);
        details.appendChild(line); result.appendChild(details);
      }
      showError('');
      const item = { decimal: input.value.trim(), fraction, mixed, time: new Date().toLocaleString() };
      history.unshift(item); history = history.slice(0, MAX_HISTORY); saveHistory(); renderHistory();
    } catch (err) {
      showError(err instanceof Error ? err.message : 'Could not convert that number.');
    }
  }
  document.getElementById('convertButton').addEventListener('click', convert);
  input.addEventListener('keydown', event => { if (event.key === 'Enter') { event.preventDefault(); convert(); } });
  document.getElementById('clearInput').addEventListener('click', () => {
    input.value = ''; showError(''); result.replaceChildren(); appendText(result, 'div', 'muted small', 'Enter a decimal to convert it.'); input.focus();
  });
  document.getElementById('clearHistory').addEventListener('click', () => { history = []; saveHistory(); renderHistory(); });
  renderHistory();
})();
</script>
