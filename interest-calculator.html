ct{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:0 0 8px}.field{width:100%;padding:13px}.result{margin-top:14px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--border)}.result strong{font-size:28px;letter-spacing:-.03em}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.stat b{display:block;font-size:22px;letter-spacing:-.03em}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:650}.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}.symbol-grid{display:flex;flex-wrap:wrap;gap:9px}.symbol{min-width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.swatch{height:92px;border-radius:16px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:9px;font-size:12px;font-weight:750;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tab.active{background:var(--accentSoft);border-color:rgba(99,91,255,.25);color:var(--accent)}.drop{border:1.5px dashed #cfcfd8;border-radius:18px;padding:35px 18px;text-align:center;background:var(--surface2)}.drop input{display:none}.small{font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.tw </head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h6"/></svg></span><span>Tools, etc.</span></a><a class="back" href="/">All tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></header><section class="hero"><span class="eyebrow">Tools, etc.</span><h1>Interest Calculator</h1><p>Calculate compound interest and see how your balance grows over time.</p></section><main class="card tool-card"><div class="grid grid-2"><div><label class="label">Principal</label><input class="field" id="principal" type="number" min="0" value="1000"></div><div><label class="label">Annual interest rate (%)</label><input class="field" id="rate" type="number" min="0" step="0.01" value="5"></div><div><label class="label">Compounds per year</label><select class="field" id="n"><option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div><div><label class="label">Years</label><input class="field" id="years" type="number" min="0" step="0.1" value="5"></div></div><div class="controls" style="margin-top:18px"><button class="btn primary" id="calc">Calculate</button></div><div class="result"><strong id="total">$1,283.36</strong><div class="muted small">Final balance</div><div style="margin-top:10px" class="small">Interest earned: <b id="interest">$283.36</b></div></div></main><div class="footer-note">Runs locally in your browser. Nothing is uploaded.</div></div><script>function money(n){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n)}function calc(){const p=+principal.value,r=+rate.value/100,n=+document.getElementById('n').value,t=+years.value;if([p,r,n,t].some(x=>!Number.isFinite(x)||x<0)||n<=0){return}const totalVal=p*Math.pow(1+r/n,n*t);document.getElementById('total').textContent=money(totalVal);document.getElementById('interest').textContent=money(totalVal-p)}document.getElementById('calc').onclick=calc;calc();</script></body></html>
