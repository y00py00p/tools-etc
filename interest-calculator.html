t:2px}textarea,input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:0 0 8px}.field{width:100%;padding:13px}.result{margin-top:14px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--border)}.result strong{font-size:28px;letter-spacing:-.03em}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:16px}.stat{padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.stat b{display:block;font-size:22px;letter-spacing:-.03em}.stat span{display:block;margin-top:4px;color:var(--muted);font-size:12px;font-weight:650}.history{margin-top:22px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.history-title{font-size:18px;font-weight:760;letter-spacing:-.02em}.history-list{display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto;padding-right:4px}.history-item{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:rgba(255,255,255,.72)}.history-equation{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.history-answer{font-size:14px;font-weight:720;white-space:nowrap}.history-empty{padding:14px 12px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:13px}.danger-btn{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:6px 0}.danger-btn:hover{color:var(--text)}

.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}.symbol-grid{display:flex;flex-wrap:wrap;gap:9px}.symbol{min-width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:12px;display:grid;place-items:center;font-size:20px;cursor:pointer}.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.swatch{height:92px;border-radius:16px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:9px;font-size:12px;font-weight:750;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tab{border:1px solid var(--border);background:var(--surface);padding:9px 12px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.tab.active{background:var(--accentSoft);border-color:rgba(99,91,255,.25);color:var(--accent)}.drop{border:1.5px dashed #cfcfd8;border-radius:18px;padding:35px 18px;text-align:center;background:var(--surface2)}.drop input{display:none}.small{font-size:13px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.two-col{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}@media(max-width:760px){.shell{width:min(100% - 24px,1100px);padding-top:16px}.hero{padding:40px 0 22px}.grid-2,.grid-3,.two-col{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:1/-1}.topbar{align-items:flex-start}.back{font-size:13px}}

</head><body><div class="shell"><header class="topbar"><a class="brand" href="/" aria-label="Tools, etc. home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools, etc.</span></a><a class="back" href="/">All tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></header><section class="hero"><span class="eyebrow">Tools, etc.</span><h1>Interest Calculator</h1><p>Calculate compound interest and see how your balance grows over time.</p></section><main class="card tool-card"><div class="grid grid-2"><div><label class="label">Principal</label><input class="field" id="principal" type="number" min="0" value=""></div><div><label class="label">Annual interest rate (%)</label><input class="field" id="rate" type="number" min="0" step="0.01" value=""></div><div><label class="label">Compounds per year</label><select class="field" id="n"><option value="1">Yearly</option><option value="4">Quarterly</option><option value="12" selected>Monthly</option><option value="365">Daily</option></select></div><div><label class="label">Years</label><input class="field" id="years" type="number" min="0" step="0.1" value=""></div></div><div class="controls" style="margin-top:18px"><button class="btn primary" id="calc">Calculate</button></div><div class="result"><strong id="total">—</strong><div class="muted small">Final balance</div><div style="margin-top:10px" class="small">Interest earned: <b id="interest">—</b></div></div><section class="history" aria-label="Calculation history"><div class="history-head"><div class="history-title">History</div><button class="danger-btn" id="clear-history" type="button">Clear all</button></div><div class="history-list" id="history-list"><div class="history-empty">No calculations yet.</div></div></section></main><div class="footer-note">Runs locally in your browser. Nothing is uploaded.</div></div><script>const HISTORY_KEY='tools-etc-interest-history';function money(n){return new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n)}function loadHistory(){try{const h=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');return Array.isArray(h)?h:[]}catch{return[]}}function saveHistory(h){localStorage.setItem(HISTORY_KEY,JSON.stringify(h.slice(0,50)))}function renderHistory(){const list=document.getElementById('history-list'),h=loadHistory();if(!h.length){list.innerHTML='<div class="history-empty">No calculations yet.</div>';return}list.innerHTML=h.map(item=>`<div class="history-item"><div class="history-equation">${item.equation}</div><div class="history-answer">${item.answer}</div></div>`).join('')}function calc(save=true){const pRaw=principal.value.trim(),rRaw=rate.value.trim(),tRaw=years.value.trim();const p=+pRaw,r=+rRaw/100,n=+document.getElementById('n').value,t=+tRaw;if(!pRaw||!rRaw||!tRaw||[p,r,n,t].some(x=>!Number.isFinite(x)||x<0)||n<=0){document.getElementById('total').textContent='—';document.getElementById('interest').textContent='—';return}const totalVal=p*Math.pow(1+r/n,n*t);const finalBalance=money(totalVal),earned=money(totalVal-p);document.getElementById('total').textContent=finalBalance;document.getElementById('interest').textContent=earned;if(save){const names={1:'yearly',4:'quarterly',12:'monthly',365:'daily'};const equation=`${money(p)} at ${r*100}% ${names[n]||`every ${n}x/year`} for ${t} year${t===1?'':'s'}`;const h=loadHistory();h.unshift({equation,answer:finalBalance});saveHistory(h);renderHistory()}}document.getElementById('calc').onclick=()=>calc(true);document.getElementById('clear-history').onclick=()=>{localStorage.removeItem(HISTORY_KEY);renderHistory()};[principal,rate,document.getElementById('n'),years].forEach(el=>el.addEventListener('input',()=>calc(false)));renderHistory();calc(false);</script></body></html>
