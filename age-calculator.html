<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#635bff" name="theme-color"/>
<meta content="Calculate your exact age in years, days, hours, minutes, and seconds." name="description"/>
<link href="https://tools-etc.vercel.app/age-calculator" rel="canonical"/>
<title>Age Calculator — Exact Age in Years, Days &amp; Seconds | Tools etc.</title>
<style>
    :root{--bg:#f7f7f9;--surface:#fff;--surface-2:#f1f1f5;--text:#17171b;--muted:#6f7078;--border:#e7e7ec;--accent:#635bff;--accent-soft:#eeecff;--shadow:0 10px 30px rgba(20,20,30,.06);--radius:24px}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}button,input{font:inherit}
    .shell{width:min(900px,calc(100% - 32px));margin:0 auto;padding:24px 0 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 28px}
    .brand{display:inline-flex;align-items:center;gap:11px;margin-left:clamp(2px,calc((100vw - 1132px)/2),40px);font-weight:750;letter-spacing:-.03em;font-size:19px}
    .brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--text);color:#fff;flex:0 0 auto}
    .brand-mark svg{width:18px;height:18px}
    .header-link{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;border-radius:10px;color:var(--muted);transition:background .18s ease,color .18s ease}
    .header-link:hover,.header-link:focus-visible{background:var(--surface);color:var(--text);outline:none}
    .header-link svg{width:16px;height:16px}
    .hero{padding:42px 0 28px;text-align:center}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:18px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.82);color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.02em}
    .eyebrow-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    h1{margin:0;font-size:clamp(40px,7vw,68px);line-height:.96;letter-spacing:-.055em;font-weight:800}
    .hero p{max-width:640px;margin:18px auto 0;color:var(--muted);font-size:17px;line-height:1.55}
    .card{padding:22px;border:1px solid var(--border);border-radius:var(--radius);background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
    .label{display:block;margin:0 0 8px;color:var(--muted);font-size:12px;font-weight:750}
    .date-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
    .date-input{width:100%;height:50px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);outline:none}
    .date-input:focus{border-color:rgba(99,91,255,.45);box-shadow:0 0 0 4px rgba(99,91,255,.10)}
    .birth-time-field{margin-top:16px}.clear-btn{height:50px;padding:0 16px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer}
    .clear-btn:hover{color:var(--text);background:var(--surface-2)}
    .result{margin-top:18px;padding:30px 22px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);text-align:center}
    .empty{color:var(--muted);font-size:15px;line-height:1.5}
    .age-main{display:flex;justify-content:center;align-items:baseline;gap:12px;flex-wrap:wrap}
    .years-number{font-size:clamp(64px,12vw,108px);line-height:.86;letter-spacing:-.07em;font-weight:850}
    .years-unit{font-size:clamp(24px,4.5vw,38px);font-weight:800;letter-spacing:-.04em}
    .days-line{margin-top:18px;font-size:clamp(40px,8vw,68px);line-height:.95;letter-spacing:-.055em;font-weight:830}
    .time-line{margin-top:16px;color:var(--muted);font-size:16px;font-weight:750;letter-spacing:.01em}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px;text-align:left}
    .detail{padding:14px;border:1px solid var(--border);border-radius:15px;background:rgba(255,255,255,.72)}
    .detail-value{font-size:16px;font-weight:800}
    .note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.5}
    @media(max-width:620px){.shell{width:min(100% - 22px,900px);padding-top:14px}header{padding-bottom:14px}.brand{margin-left:clamp(1px,calc((100vw - 1132px)/2),40px)}.header-link span{display:none}.hero{padding:42px 0 22px}.card{padding:18px}.date-row{grid-template-columns:1fr}.clear-btn{width:100%}.details{grid-template-columns:1fr}.result{padding:24px 14px}}
  

/* Tools etc. shared page chrome */
header.site-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;padding:8px 0 24px!important;margin:0!important;width:min(1180px,calc(100vw - 32px))!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important}
header.site-header .brand{display:inline-flex!important;align-items:center!important;gap:11px!important;margin:0!important;font-family:inherit!important;font-size:19px!important;font-weight:750!important;letter-spacing:-.03em!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important}
header.site-header .brand-mark{width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:10px!important;background:var(--text)!important;color:#fff!important;flex:0 0 auto!important;box-shadow:none!important}
header.site-header .brand-mark svg{width:18px!important;height:18px!important}
header.site-header .back{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;padding:10px 12px!important;border:1px solid var(--border)!important;border-radius:10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:14px!important;font-weight:650!important;line-height:1.2!important;text-decoration:none!important;white-space:nowrap!important}
header.site-header .back:hover,header.site-header .back:focus-visible{background:var(--surface)!important;color:var(--text)!important;outline:none!important}
header.site-header .back svg{display:block!important;width:16px!important;height:16px!important;flex:0 0 auto!important;transform:none!important}
.hero{padding:34px 0 24px!important;text-align:center!important}
.hero h1,h1{margin:0!important;font-family:inherit!important;font-size:clamp(34px,5.5vw,54px)!important;line-height:1!important;letter-spacing:-.05em!important;font-weight:800!important}
button{font-family:inherit}
@media(max-width:620px){header.site-header{padding:4px 0 18px!important}header.site-header .brand{margin:0!important;font-size:18px!important}header.site-header .back{font-size:14px!important;padding:9px 10px!important}.hero{padding:28px 0 20px!important}}

/* Shared history controls */
.history-head button{appearance:none!important;border:1px solid var(--border)!important;border-radius:10px!important;padding:8px 10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;cursor:pointer!important;transition:background .16s ease,color .16s ease,border-color .16s ease!important}
.history-head button:hover,.history-head button:focus-visible{background:var(--surface2)!important;color:var(--text)!important;outline:none!important}
</style>
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
<script defer="" src="/_vercel/insights/script.js"></script>
</head>
<body>
<main class="shell">
<header class="site-header"><a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a><a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></header>
<section class="hero">
<h1>Age Calculator</h1>

</section>
<section class="card">
<label class="label" for="birthday">Your birthday</label>
<div class="date-row">
<input autocomplete="bday" class="date-input" id="birthday" type="date"/>
<button class="clear-btn" id="clear" type="button">Clear</button>
</div>
<div class="birth-time-field"><label class="label" for="birthTime">Birth time (optional, local time)</label><input class="date-input" id="birthTime" type="time" /></div>
<div aria-live="polite" class="result">
<div class="empty" id="empty">Enter your birthday to calculate your age.</div>
<div hidden="" id="ageResult">
<div class="age-main"><span class="years-number" id="years">0</span><span class="years-unit">years</span></div>
<div class="days-line"><span id="days">0</span> days</div>
<div class="time-line" id="timeLine">00h 00m 00s</div>
<div class="details">
<div class="detail"><div class="label">Birthday</div><div class="detail-value" id="birthdayText">—</div></div>
<div class="detail"><div class="label">Next birthday</div><div class="detail-value" id="nextBirthday">—</div></div>
</div>
<div class="note">All dates and times are interpreted in your current local time. If you leave birth time blank, midnight is used.</div>
</div>
</div>
</section>
</main>
<script>
    (() => {
      const birthday = document.getElementById('birthday');
      const birthTime = document.getElementById('birthTime');
      const clear = document.getElementById('clear');
      const empty = document.getElementById('empty');
      const result = document.getElementById('ageResult');
      const years = document.getElementById('years');
      const days = document.getElementById('days');
      const timeLine = document.getElementById('timeLine');
      const birthdayText = document.getElementById('birthdayText');
      const nextBirthday = document.getElementById('nextBirthday');

      const pad = n => String(n).padStart(2,'0');
      const dateAtMidnight = (y,m,d) => new Date(y,m,d,0,0,0,0);
      const daysInMonth = (y,m) => new Date(y,m+1,0).getDate();
      const addYears = (d,n) => new Date(d.getFullYear()+n,d.getMonth(),Math.min(d.getDate(),daysInMonth(d.getFullYear()+n,d.getMonth())),d.getHours(),d.getMinutes(),d.getSeconds(),d.getMilliseconds());
      const parseInput = value => {
        if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        const [y,m,d] = value.split('-').map(Number);
        const date = dateAtMidnight(y,m-1,d);
        return date.getFullYear()===y && date.getMonth()===m-1 && date.getDate()===d ? date : null;
      };
      const parseBirth = () => { const date=parseInput(birthday.value); if(!date)return null; const parts=(birthTime.value||'00:00').split(':').map(Number); return new Date(date.getFullYear(),date.getMonth(),date.getDate(),parts[0]||0,parts[1]||0,0,0); };
      const fmtDate = d => new Intl.DateTimeFormat(undefined,{year:'numeric',month:'long',day:'numeric'}).format(d);

      function update(){
        const birth = parseBirth(), now = new Date();
        if(!birth){ empty.textContent='Enter your birthday to calculate your age.'; empty.hidden=false; result.hidden=true; return; }
        if(birth > now){ empty.textContent="Your birthday can't be in the future."; empty.hidden=false; result.hidden=true; return; }
        let ageYears = now.getFullYear()-birth.getFullYear();
        let anniversary = addYears(birth,ageYears);
        if(anniversary>now){ ageYears--; anniversary=addYears(birth,ageYears); }
        const totalSeconds = Math.floor((now-anniversary)/1000);
        const wholeDays = Math.floor(totalSeconds/86400);
        const remainder = totalSeconds%86400;
        const hours = Math.floor(remainder/3600);
        const minutes = Math.floor((remainder%3600)/60);
        const seconds = remainder%60;
        years.textContent = ageYears.toLocaleString();
        days.textContent = wholeDays.toLocaleString();
        timeLine.textContent = `${pad(hours)}h ${pad(minutes)}m ${pad(seconds)}s`;
        birthdayText.textContent = fmtDate(birth);
        nextBirthday.textContent = fmtDate(addYears(birth,ageYears+1));
        empty.hidden=true; result.hidden=false;
      }
      birthday.addEventListener('input',update);
      birthTime.addEventListener('input',update);
      clear.addEventListener('click',()=>{birthday.value='';birthTime.value='';update();birthday.focus();});
      update();
      setInterval(update,250);
    })();
  </script>
</body>
</html>
