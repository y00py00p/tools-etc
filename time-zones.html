*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(1100px,calc(100% - 36px));margin:0 auto;padding:24px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:20px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:30px;height:30px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;box-shadow:0 7px 18px rgba(99,91,255,.22)}.brand-mark svg{width:17px;height:17px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:650}.back svg{width:16px}.hero{padding:54px 0 28px}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:700}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 12px}.hero p{max-width:640px;color:var(--muted);font-size:16px;line-height:1.65;margin:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.tool-card{padding:22px}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:0 0 8px}.field{width:100%;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text)}.field:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid rgba(99,91,255,.2);outline-offset:2px}.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.muted{color:var(--muted)}.small{font-size:13px}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.result{margin-top:14px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--border)}.city-results{display:grid;gap:9px;margin-top:10px;max-height:290px;overflow:auto}.city-result{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;padding:12px 14px;border:1px solid var(--border);background:var(--surface);border-radius:14px;text-align:left;cursor:pointer}.city-result:hover{border-color:rgba(99,91,255,.35);background:#fbfaff}.city-result strong{font-size:14px}.city-result span{font-size:12px;color:var(--muted)}.city-time{font-size:14px;font-weight:800;white-space:nowrap}.selected{margin-top:14px;padding:20px;border:1px solid var(--border);border-radius:18px;background:var(--surface2)}.selected-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.zone-pill{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;background:var(--accentSoft);color:var(--accent);font-size:12px;font-weight:750}.big-time{font-size:42px;font-weight:800;letter-spacing:-.045em;margin-top:6px}.converter{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}.converter-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.convert-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.compare-card{padding:18px;border:1px solid var(--border);border-radius:16px;background:var(--surface2)}.compare-time{font-size:30px;font-weight:800;letter-spacing:-.035em;margin:4px 0}.compare-label{font-size:12px;color:var(--muted);font-weight:650}.status{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.5}.empty{padding:14px;text-align:center;color:var(--muted);font-size:13px}.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}@media(max-width:760px){.shell{width:min(100% - 24px,1100px);padding-top:16px}.hero{padding:40px 0 22px}.grid-2,.converter-grid,.convert-row,.compare{grid-template-columns:1fr}.big-time{font-size:34px}.topbar{align-items:flex-start}.back{font-size:13px}}

button{font-family:inherit}
@media(max-width:620px){header.site-header{padding:4px 0 18px!important}header.site-header .brand{margin:0!important;font-size:18px!important}header.site-header .back{font-size:14px!important;padding:9px 10px!important}.hero{padding:28px 0 20px!important}}

/* Shared history controls */
.history-head button{appearance:none!important;border:1px solid var(--border)!important;border-radius:10px!important;padding:8px 10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;cursor:pointer!important;transition:background .16s ease,color .16s ease,border-color .16s ease!important}

<body>
<div class="shell">
<header class="site-header"><a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a><a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></header>
<section class="hero"><h1>Time Zones</h1></section>
<main class="card tool-card">
<section>
<label class="label" for="citySearch">Search a city</label>
<input aria-label="Search a city" autocomplete="off" class="field" id="citySearch" placeholder="Vancouver, Tokyo, London..." type="search"/>
<div class="city-results" id="cityResults"></div>
<div class="selected" id="selected">
<div class="selected-top"><div><div class="label">Selected city</div><div id="selectedName" style="font-size:22px;font-weight:800">Vancouver</div><div class="muted small" id="selectedDate"></div></div><span class="zone-pill" id="selectedZone">America/Vancouver</span></div>
<div class="big-time" id="selectedTime">--:--:--</div><div class="muted small">Local time</div>
</div>
</section>
<section class="converter">
<div class="label">Time zone converter</div>
<div class="converter-grid">
<div><label class="label" for="fromCity">From</label><select class="field" id="fromCity"></select></div>
<div><label class="label" for="toCity">To</label><select class="field" id="toCity"></select></div>
</div>
<div class="convert-row">
<div><label class="label" for="convertDate">Date</label><input class="field" id="convertDate" type="date"/></div>
<div><label class="label" for="convertTime">Time</label><input class="field" id="convertTime" step="60" type="time"/></div>
</div>
<div class="compare">
<div class="compare-card"><div class="label" id="fromLabel">Vancouver</div><div class="compare-time" id="fromTime">--:--</div><div class="compare-label" id="fromZone">--</div></div>
<div class="compare-card"><div class="label" id="toLabel">Tokyo</div><div class="compare-time" id="toTime">--:--</div><div class="compare-label" id="toZone">--</div></div>
</div>
<div class="result"><strong id="differenceText">--</strong><div class="muted small">Time difference</div></div>

</section>
</main>

</div>
<script>
const cities=[
["Vancouver","Canada","America/Vancouver"],["Toronto","Canada","America/Toronto"],["Montreal","Canada","America/Toronto"],["Calgary","Canada","America/Edmonton"],["Edmonton","Canada","America/Edmonton"],["Winnipeg","Canada","America/Winnipeg"],["Halifax","Canada","America/Halifax"],["St. John's","Canada","America/St_Johns"],["New York","United States","America/New_York"],["Chicago","United States","America/Chicago"],["Denver","United States","America/Denver"],["Los Angeles","United States","America/Los_Angeles"],["Phoenix","United States","America/Phoenix"],["Honolulu","United States","Pacific/Honolulu"],["Mexico City","Mexico","America/Mexico_City"],["São Paulo","Brazil","America/Sao_Paulo"],["Buenos Aires","Argentina","America/Argentina/Buenos_Aires"],["London","United Kingdom","Europe/London"],["Dublin","Ireland","Europe/Dublin"],["Lisbon","Portugal","Europe/Lisbon"],["Paris","France","Europe/Paris"],["Madrid","Spain","Europe/Madrid"],["Berlin","Germany","Europe/Berlin"],["Rome","Italy","Europe/Rome"],["Amsterdam","Netherlands","Europe/Amsterdam"],["Moscow","Russia","Europe/Moscow"],["Cairo","Egypt","Africa/Cairo"],["Johannesburg","South Africa","Africa/Johannesburg"],["Nairobi","Kenya","Africa/Nairobi"],["Dubai","United Arab Emirates","Asia/Dubai"],["Mumbai","India","Asia/Kolkata"],["Delhi","India","Asia/Kolkata"],["Bangkok","Thailand","Asia/Bangkok"],["Singapore","Singapore","Asia/Singapore"],["Hong Kong","Hong Kong","Asia/Hong_Kong"],["Shanghai","China","Asia/Shanghai"],["Beijing","China","Asia/Shanghai"],["Seoul","South Korea","Asia/Seoul"],["Tokyo","Japan","Asia/Tokyo"],["Osaka","Japan","Asia/Tokyo"],["Sydney","Australia","Australia/Sydney"],["Melbourne","Australia","Australia/Melbourne"],["Perth","Australia","Australia/Perth"],["Auckland","New Zealand","Pacific/Auckland"],["Anchorage","United States","America/Anchorage"],["Reykjavik","Iceland","Atlantic/Reykjavik"],["Istanbul","Turkey","Europe/Istanbul"],["Cape Town","South Africa","Africa/Johannesburg"]
];
const $=id=>document.getElementById(id);
const search=$("citySearch"),results=$("cityResults");
let selected=cities[0];
function fmtTime(date,zone,seconds=false){return new Intl.DateTimeFormat(undefined,{timeZone:zone,hour:"numeric",minute:"2-digit",second:seconds?"2-digit":undefined,hour12:undefined}).format(date)}
function fmtDate(date,zone){return new Intl.DateTimeFormat(undefined,{timeZone:zone,weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(date)}
function offsetMinutes(date,zone){const p=new Intl.DateTimeFormat("en-US",{timeZone:zone,timeZoneName:"longOffset",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(date).find(x=>x.type==="timeZoneName")?.value||"GMT";if(p==="GMT"||p==="GMT+00:00")return 0;const m=p.match(/GMT([+-])(\d{2}):?(\d{2})?/);return m?(m[1]==="+"?1:-1)*(+m[2]*60+(+(m[3]||0))):0}
function offsetText(date,zone){const n=offsetMinutes(date,zone),a=Math.abs(n);return `UTC${n>=0?"+":"-"}${String(Math.floor(a/60)).padStart(2,"0")}:${String(a%60).padStart(2,"0")}`}
function renderResults(list){results.innerHTML="";if(!search.value.trim()){return}if(!list.length){results.innerHTML='<div class="empty">No matching city found.</div>';return}const now=new Date();list.slice(0,14).forEach(c=>{const b=document.createElement("button");b.type="button";b.className="city-result";b.innerHTML=`<span><strong>${c[0]}</strong><br><span>${c[1]} · ${c[2]}</span></span><span class="city-time">${fmtTime(now,c[2])}</span>`;b.addEventListener("click",()=>selectCity(c));results.appendChild(b)})}
function selectCity(c){selected=c;search.value=c[0];results.innerHTML="";$('selectedName').textContent=c[0];$('selectedZone').textContent=c[2];updateSelected()}
function updateSelected(){const now=new Date();$('selectedTime').textContent=fmtTime(now,selected[2],true);$('selectedDate').textContent=fmtDate(now,selected[2])}
function populate(){cities.forEach((c,i)=>{for(const id of ["fromCity","toCity"]){const o=document.createElement("option");o.value=i;o.textContent=`${c[0]} — ${c[1]}`;$(id).appendChild(o)}});$('fromCity').value=0;$('toCity').value=cities.findIndex(c=>c[0]==="Tokyo");const now=new Date();const date=new Intl.DateTimeFormat("en-CA",{year:"numeric",month:"2-digit",day:"2-digit"}).format(now);$('convertDate').value=date;$('convertTime').value=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`}
function localEpochFromFields(dateStr,timeStr,zone){
  const [Y,M,D]=dateStr.split("-").map(Number),[h,m]=timeStr.split(":").map(Number);let guess=Date.UTC(Y,M-1,D,h,m);for(let i=0;i<3;i++){const off=offsetMinutes(new Date(guess),zone);const next=Date.UTC(Y,M-1,D,h,m)-off*60000;if(Math.abs(next-guess)<1000)break;guess=next}return new Date(guess)}
function updateConverter(){const a=cities[+$('fromCity').value],b=cities[+$('toCity').value],d=$('convertDate').value,t=$('convertTime').value;if(!d||!t)return;const instant=localEpochFromFields(d,t,a[2]);$('fromLabel').textContent=a[0];$('toLabel').textContent=b[0];$('fromTime').textContent=fmtTime(instant,a[2]);$('toTime').textContent=fmtTime(instant,b[2]);$('fromZone').textContent=offsetText(instant,a[2]);$('toZone').textContent=offsetText(instant,b[2]);const diff=offsetMinutes(instant,b[2])-offsetMinutes(instant,a[2]),abs=Math.abs(diff),hrs=Math.floor(abs/60),mins=abs%60;$('differenceText').textContent=diff===0?"Same local time":`${hrs}${mins?`h ${mins}m`:"h"} ${b[0]} is ${diff>0?"ahead":"behind"}`}
search.addEventListener("input",()=>{const q=search.value.trim().toLowerCase();renderResults(q?cities.filter(c=>(c[0]+" "+c[1]+" "+c[2]).toLowerCase().includes(q)):[])});
$('fromCity').addEventListener('change',updateConverter);$('toCity').addEventListener('change',updateConverter);$('convertDate').addEventListener('input',updateConverter);$('convertTime').addEventListener('input',updateConverter);
populate();selectCity(cities[0]);updateConverter();setInterval(()=>{updateSelected();if(search.value.trim()){$('cityResults').querySelectorAll('.city-result').forEach((b,i)=>{const q=search.value.trim().toLowerCase();const list=cities.filter(c=>(c[0]+" "+c[1]+" "+c[2]).toLowerCase().includes(q));if(list[i])b.querySelector('.city-time').textContent=fmtTime(new Date(),list[i][2])})}},1000);
</script>
</body>
