<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#635bff" />
<meta name="description" content="Send feedback and ideas to help improve Tools, etc." />
<link rel="canonical" href="https://tools-etc.vercel.app/feedback" />
<meta property="og:title" content="Feedback | Tools, etc." />
<meta property="og:description" content="Share feedback and ideas for Tools, etc." />
<meta property="og:url" content="https://tools-etc.vercel.app/feedback" />
<meta property="og:type" content="website" />
<title>Feedback | Tools, etc.</title>
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{--bg:#f7f7f9;--surface:#fff;--surface2:#f1f1f5;--text:#17171b;--muted:#6f7078;--border:#e7e7ec;--accent:#635bff;--accent-soft:#eeecff;--shadow:0 10px 30px rgba(20,20,30,.06);--radius-lg:24px}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}
.shell{width:min(760px,calc(100% - 32px));margin:0 auto;padding:24px 0 50px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 28px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:750;letter-spacing:-.03em;font-size:19px}
.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--text);color:#fff;flex:0 0 auto}
.brand-mark svg{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:7px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:14px;font-weight:700}
.back:hover{background:var(--surface);color:var(--text)}.back svg{width:16px;height:16px}
.hero{text-align:center;padding:44px 0 28px}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.82);color:var(--muted);font-size:12px;font-weight:650}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
h1{margin:16px 0 12px;font-size:clamp(40px,7vw,64px);line-height:.96;letter-spacing:-.055em;font-weight:800}.hero p{max-width:620px;margin:0 auto;color:var(--muted);font-size:17px;line-height:1.55}
.card{padding:22px;border:1px solid var(--border);border-radius:var(--radius-lg);background:rgba(255,255,255,.92);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}.field-group{display:grid;gap:8px}.label{color:var(--muted);font-size:12px;font-weight:750}.field{width:100%;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);outline:none}.field:focus{border-color:rgba(99,91,255,.45);box-shadow:0 0 0 4px rgba(99,91,255,.10)}textarea.field{min-height:160px;resize:vertical;line-height:1.5}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}.btn{border:1px solid var(--border);border-radius:12px;padding:11px 15px;background:var(--surface);color:var(--text);font-weight:750;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:hover{transform:translateY(-1px)}
.status{display:none;margin-top:14px;padding:13px 14px;border-radius:13px;background:var(--surface2);color:var(--muted);font-size:13px;line-height:1.5}.status.show{display:block}.small{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}
@media(max-width:620px){.shell{width:min(100% - 22px,760px);padding-top:14px}header{padding-bottom:14px}.hero{padding:40px 0 24px}.actions{flex-direction:column-reverse;align-items:stretch}.btn{width:100%}}
</style>
</head>
<body>
<div class="shell">
<header>
  <a class="brand" href="/" aria-label="Tools, etc. home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools, etc.</span></a>
  <a class="back" href="/"><span>All tools</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a>
</header>
<section class="hero"><div class="eyebrow"><span class="dot" aria-hidden="true"></span>Help improve the site</div><h1>Feedback</h1><p>Tell us what works, what doesn't, or what tool you'd like to see next.</p></section>
<section class="card">
<form id="feedbackForm" class="grid">
  <div class="field-group"><label class="label" for="type">Feedback type</label><select id="type" class="field"><option>General feedback</option><option>Bug report</option><option>Feature request</option><option>New tool idea</option><option>Other</option></select></div>
  <div class="field-group"><label class="label" for="rating">How useful is Tools, etc.?</label><select id="rating" class="field"><option value="">No rating</option><option>1 / 5</option><option>2 / 5</option><option>3 / 5</option><option>4 / 5</option><option>5 / 5</option></select></div>
  <div class="field-group"><label class="label" for="message">Your feedback</label><textarea id="message" class="field" maxlength="5000" placeholder="Tell us what you think..."></textarea></div>
  <div class="field-group"><label class="label" for="contact">Contact (optional)</label><input id="contact" class="field" type="text" maxlength="200" placeholder="Email or another way to reach you"></div>
  <div class="actions"><button id="copy" class="btn" type="button">Copy feedback</button><button class="btn primary" type="submit">Save feedback</button></div>
  <div id="status" class="status" aria-live="polite"></div>
</form>
<div class="small">This site is currently static, so feedback is saved only in your browser until a submission service is connected.</div>
</section>
</div>
<script>
(() => {
  const form=document.getElementById('feedbackForm'),type=document.getElementById('type'),rating=document.getElementById('rating'),message=document.getElementById('message'),contact=document.getElementById('contact'),status=document.getElementById('status'),copy=document.getElementById('copy');
  const KEY='toolsEtcFeedbackDraft';
  const show=(msg)=>{status.textContent=msg;status.classList.add('show');};
  const payload=()=>({type:type.value,rating:rating.value,message:message.value.trim(),contact:contact.value.trim(),savedAt:new Date().toISOString()});
  const text=()=>{const p=payload();return `Tools, etc. feedback

Type: ${p.type}
Rating: ${p.rating || 'No rating'}

${p.message || '(No message)'}

Contact: ${p.contact || 'Not provided'}`;};
  try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved){type.value=saved.type||type.value;rating.value=saved.rating||'';message.value=saved.message||'';contact.value=saved.contact||'';}}catch{}
  form.addEventListener('submit',e=>{e.preventDefault();if(!message.value.trim()){show('Please enter some feedback first.');message.focus();return;}localStorage.setItem(KEY,JSON.stringify(payload()));show('Feedback saved in this browser. Use Copy feedback to send it manually.');});
  copy.addEventListener('click',async()=>{if(!message.value.trim()){show('Please enter some feedback first.');message.focus();return;}const t=text();try{await navigator.clipboard.writeText(t);show('Feedback copied successfully!');}catch{const area=document.createElement('textarea');area.value=t;document.body.appendChild(area);area.select();document.execCommand('copy');area.remove();show('Feedback copied successfully!');}});
})();
</script>
</body>
</html>
