*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(1100px,calc(100% - 36px));margin:0 auto;padding:24px 0 56px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:inline-flex;align-items:center;gap:11px;margin-left:0;font-size:19px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--text);color:#fff;flex:0 0 auto}.brand-mark svg{width:18px;height:18px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:650}.back svg{width:16px}.hero{padding:54px 0 28px}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:700}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 12px}.hero p{max-width:640px;color:var(--muted);font-size:16px;line-height:1.65;margin:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.tool-card{padding:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(99,91,255,.2);outline-offset:2px}textarea,input,select{font:inherit; id;grid-template-columns:1.2fr .8fr;gap:16px}@media(max-width:760px){.shell{width:min(100% - 24px,1100px);padding-top:16px}.hero{padding:40px 0 22px}.grid-2,.grid-3,.two-col{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat:last-child{grid-column:1/-1}.topbar{align-items:flex-start}.back{font-size:13px}}

div><div><div class="muted small">Fast · 160 WPM</div><strong id="readingFast" style="font-size:20px">0 sec</strong></div></div></div></main></div><script>(() => {const text=document.getElementById('text');const el={words:document.getElementById('words'),characters:document.getElementById('characters'),noSpaces:document.getElementById('noSpaces'),sentences:document.getElementById('sentences'),reading:document.getElementById('reading'),readingSlow:document.getElementById('readingSlow'),readingMedium:document.getElementById('readingMedium'),readingFast:document.getElementById('readingFast'),status:document.getElementById('status')};function formatTime(sec){return sec<60?sec+' sec':Math.floor(sec/60)+' min'+(sec%60?' '+sec%60+' sec':'')}function stats(v){const n=v.replace(/\r\n?/g,'\n'),t=n.trim(),w=t?t.split(/\s+/u).length:0,s=t?(t.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/gu)||[]).filter(x=>x.trim()).length:0;return {w,c:v.length,ns:v.replace(/\s/gu,'').length,s}}function update(){if(text.value.length>40000)text.value=text.value.slice(0,40000);const x=stats(text.value),slow=x.w?Math.max(1,Math.ceil(x.w/100*60)):0,medium=x.w?Math.max(1,Math.ceil(x.w/130*60)):0,fast=x.w?Math.max(1,Math.ceil(x.w/160*60)):0;el.words.textContent=x.w.toLocaleString();el.characters.textContent=x.c.toLocaleString();el.noSpaces.textContent=x.ns.toLocaleString();el.sentences.textContent=x.s.toLocaleString();el.reading.textContent=formatTime(medium);el.readingSlow.textContent=formatTime(slow);el.readingMedium.textContent=formatTime(medium);el.readingFast.textContent=formatTime(fast);el.status.textContent=x.c.toLocaleString()+'/40,000 characters'}text.addEventListener('input',update);document.getElementById('clear').onclick=()=>{text.value='';update();text.focus()};document.getElementById('copy').onclick=async()=>{if(!text.value)return;try{await navigator.clipboard.writeText(text.value)}catch{ text.focus();text.select();document.execCommand('copy');text.setSelectionRange(text.value.length,text.value.length)}};update()})()</script></body></html>
