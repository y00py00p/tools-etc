<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#635bff" />
  <meta name="description" content="A fast, clean browser-based word counter." />
  <title>Word Counter — Tools, etc.</title>
  <style>
    :root {
      --bg: #f7f7f9;
      --surface: #ffffff;
      --surface-2: #f1f1f5;
      --text: #17171b;
      --muted: #6f7078;
      --border: #e7e7ec;
      --accent: #635bff;
      --accent-soft: #eeecff;
      --shadow: 0 10px 30px rgba(20, 20, 30, 0.06);
      --shadow-hover: 0 18px 48px rgba(20, 20, 30, 0.10);
      --radius-lg: 24px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% -10%, rgba(99, 91, 255, 0.08), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }
    button, textarea { font: inherit; }

    .shell {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 42px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 8px 0 28px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-weight: 750;
      letter-spacing: -0.03em;
      font-size: 19px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--text);
      color: #fff;
      flex: 0 0 auto;
    }

    .brand-mark svg { width: 18px; height: 18px; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 12px;
      border-radius: 10px;
      color: var(--muted);
      transition: background .18s ease, color .18s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .back-link svg { width: 16px; height: 16px; }

    .hero {
      padding: 40px 0 28px;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255,255,255,.82);
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .02em;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 66px);
      line-height: .96;
      letter-spacing: -0.055em;
      font-weight: 800;
    }

    .hero p {
      max-width: 650px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.55;
    }

    .workspace {
      display: grid;
      gap: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .stat {
      min-height: 102px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255,255,255,.90);
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .stat-value {
      margin-top: 8px;
      font-size: 27px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: -0.03em;
    }

    .editor-card {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.92);
      box-shadow: var(--shadow);
    }

    .editor-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 4px 12px;
    }

    .editor-title {
      font-size: 14px;
      font-weight: 730;
      letter-spacing: -0.01em;
    }

    .editor-hint {
      color: var(--muted);
      font-size: 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 400px;
      padding: 20px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 16px;
      outline: none;
      background: var(--surface-2);
      color: var(--text);
      line-height: 1.65;
      font-size: 16px;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    textarea::placeholder { color: #9697a0; }

    textarea:focus {
      background: var(--surface);
      border-color: rgba(99,91,255,.45);
      box-shadow: 0 0 0 4px rgba(99,91,255,.10);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 4px 0;
    }

    .left-actions,
    .right-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s ease;
    }

    .button:hover {
      border-color: #d8d8e2;
      background: #fafafd;
      transform: translateY(-1px);
    }

    .button:focus-visible {
      outline: none;
      border-color: rgba(99,91,255,.45);
      box-shadow: 0 0 0 4px rgba(99,91,255,.10);
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .button.primary:hover {
      border-color: var(--accent);
      background: #5a52eb;
    }

    .button svg { width: 16px; height: 16px; }

    .status {
      color: var(--muted);
      font-size: 12px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translate(-50%, 12px);
      opacity: 0;
      pointer-events: none;
      padding: 10px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: rgba(23,23,27,.94);
      color: #fff;
      font-size: 12px;
      transition: opacity .2s ease, transform .2s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 20px;
      padding: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    @media (max-width: 900px) {
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 620px) {
      .shell { width: min(100% - 22px, 1080px); padding-top: 14px; }
      header { padding-bottom: 14px; }
      .hero { padding: 44px 0 26px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      textarea { min-height: 330px; padding: 16px; }
      .actions { align-items: stretch; flex-direction: column; }
      .left-actions, .right-actions { width: 100%; }
      .left-actions .button, .right-actions .button { flex: 1; }
      .editor-hint { display: none; }
      .footer { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 390px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .stat { padding: 15px; }
      .stat:nth-child(5) { grid-column: 1 / -1; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <a class="brand" href="/" aria-label="Tools, etc. home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6" />
            <path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3" />
            <path d="M8.2 15h7.6" />
          </svg>
        </span>
        <span>Tools, etc.</span>
      </a>
      <a class="back-link" href="/" aria-label="Back to all tools">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="m11 18-6-6 6-6" />
        </svg>
        <span>All tools</span>
      </a>
    </header>

    <section class="hero">
      <div class="eyebrow"><span class="eyebrow-dot" aria-hidden="true"></span>Text</div>
      <h1>Word Counter</h1>
      <p>Count words, characters, sentences, paragraphs, and estimated reading time as you type.</p>
    </section>

    <section class="workspace" aria-label="Word counter">
      <div class="stats">
        <div class="stat"><div class="stat-label">Words</div><div class="stat-value" id="words">0</div></div>
        <div class="stat"><div class="stat-label">Characters</div><div class="stat-value" id="characters">0</div></div>
        <div class="stat"><div class="stat-label">No spaces</div><div class="stat-value" id="noSpaces">0</div></div>
        <div class="stat"><div class="stat-label">Sentences</div><div class="stat-value" id="sentences">0</div></div>
        <div class="stat"><div class="stat-label">Paragraphs</div><div class="stat-value" id="paragraphs">0</div></div>
      </div>

      <div class="editor-card">
        <div class="editor-top">
          <div class="editor-title">Your text</div>
          <div class="editor-hint">Everything stays in your browser</div>
        </div>
        <textarea id="text" spellcheck="true" placeholder="Start typing or paste your text here..."></textarea>
        <div class="actions">
          <div class="left-actions">
            <button class="button" id="clear" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 7h16" /><path d="M10 11v6" /><path d="M14 11v6" /><path d="m9 7 .7-2h4.6l.7 2" /><path d="M6 7l.8 13h10.4L18 7" />
              </svg>
              Clear
            </button>
          </div>
          <div class="right-actions">
            <span class="status" id="status">0 words</span>
            <button class="button primary" id="copy" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="8" y="8" width="11" height="11" rx="2" />
                <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
              </svg>
              Copy text
            </button>
          </div>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span>Tools, etc.</span>
      <span id="readingTime">Estimated reading time: 0 sec</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const text = document.getElementById('text');
      const wordsEl = document.getElementById('words');
      const charactersEl = document.getElementById('characters');
      const noSpacesEl = document.getElementById('noSpaces');
      const sentencesEl = document.getElementById('sentences');
      const paragraphsEl = document.getElementById('paragraphs');
      const statusEl = document.getElementById('status');
      const readingTimeEl = document.getElementById('readingTime');
      const toastEl = document.getElementById('toast');

      function getStats(value) {
        const normalized = value.replace(/\r\n?/g, '\n');
        const trimmed = normalized.trim();
        const words = trimmed ? trimmed.split(/\s+/u).length : 0;
        const characters = value.length;
        const noSpaces = value.replace(/\s/gu, '').length;
        const sentences = trimmed ? (trimmed.match(/[^.!?]+[.!?]+(?=\s|$)|[^.!?]+$/gu) || []).filter(s => s.trim()).length : 0;
        const paragraphs = trimmed ? normalized.split(/\n\s*\n/).filter(p => p.trim()).length : 0;
        const seconds = words ? Math.max(1, Math.ceil(words / 200 * 60)) : 0;
        return { words, characters, noSpaces, sentences, paragraphs, seconds };
      }

      function formatTime(seconds) {
        if (seconds < 60) return `${seconds} sec`;
        const minutes = Math.floor(seconds / 60);
        const remaining = seconds % 60;
        return remaining ? `${minutes} min ${remaining} sec` : `${minutes} min`;
      }

      function update() {
        const stats = getStats(text.value);
        wordsEl.textContent = stats.words.toLocaleString();
        charactersEl.textContent = stats.characters.toLocaleString();
        noSpacesEl.textContent = stats.noSpaces.toLocaleString();
        sentencesEl.textContent = stats.sentences.toLocaleString();
        paragraphsEl.textContent = stats.paragraphs.toLocaleString();
        statusEl.textContent = `${stats.words.toLocaleString()} word${stats.words === 1 ? '' : 's'}`;
        readingTimeEl.textContent = `Estimated reading time: ${formatTime(stats.seconds)}`;
      }

      function toast(message) {
        toastEl.textContent = message;
        toastEl.classList.add('show');
        clearTimeout(toast.timeout);
        toast.timeout = setTimeout(() => toastEl.classList.remove('show'), 1600);
      }

      text.addEventListener('input', update);

      document.getElementById('clear').addEventListener('click', () => {
        text.value = '';
        update();
        text.focus();
        toast('Text cleared');
      });

      document.getElementById('copy').addEventListener('click', async () => {
        if (!text.value) {
          toast('There is no text to copy');
          return;
        }

        try {
          await navigator.clipboard.writeText(text.value);
          toast('Text copied');
        } catch {
          text.focus();
          text.select();
          const copied = document.execCommand('copy');
          text.setSelectionRange(text.value.length, text.value.length);
          toast(copied ? 'Text copied' : 'Copy failed');
        }
      });

      update();
    })();
  </script>
</body>
</html>
