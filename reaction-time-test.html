<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#635bff"><meta name="description" content="Test your reaction speed. Wait for green, then click as quickly as you can."><link rel="canonical" href="https://tools-etc.vercel.app/reaction-time-test"><title>Reaction Time Test — Tools etc.</title><style>
:root{--bg:#f7f7f8;--surface:#fff;--surface2:#f0f0f3;--text:#17171b;--muted:#6d6e76;--border:#dedee4;--accent:#635bff;--accent-soft:#eeecff}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.shell{width:min(900px,calc(100% - 32px));margin:auto;padding:22px 0 48px}header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 24px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--text);color:#fff}.brand-mark svg{width:18px;height:18px}.back{font-size:13px;color:var(--muted);padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}.back:hover{color:var(--text);background:var(--surface2)}.hero{text-align:center;padding:28px 0 26px}.eyebrow{font-size:12px;color:var(--muted);font-weight:750;margin-bottom:12px}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.05em;margin:0}.hero p{margin:12px auto 0;color:var(--muted);line-height:1.5;font-size:15px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:9px}.note{color:var(--muted);font-size:12px;line-height:1.5}.status{min-height:22px;margin-top:12px;color:var(--muted);font-size:13px;text-align:center}.primary{border:1px solid var(--text);border-radius:9px;padding:10px 14px;color:#fff;background:var(--text);font-weight:700}.primary:hover{background:#33333a}.analytics-spacer{height:1px}@media(max-width:620px){.shell{width:calc(100% - 22px);padding-top:14px}header{padding-bottom:14px}.hero{padding:24px 0 20px}.panel{padding:15px}}
</style>
<style>
.reaction-space{width:100%;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px solid #d8d8df;border-radius:12px;background:#fff;color:#17171b;text-align:center;user-select:none;touch-action:manipulation;transition:background-color .08s linear,color .08s linear}.reaction-space:hover{filter:brightness(.99)}.reaction-space.waiting{background:#e43d42;color:#fff;border-color:#e43d42}.reaction-space.go{background:#24b56a;color:#fff;border-color:#24b56a}.reaction-space.result{background:#24b56a;color:#fff;border-color:#24b56a}.reaction-space .big{font-size:clamp(32px,6vw,54px);font-weight:850;letter-spacing:-.05em}.reaction-space .small{font-size:14px;opacity:.82}.result-box{margin-top:14px;text-align:center;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:4px}.result-number{font-size:30px;font-weight:850;letter-spacing:-.04em}.status{margin-top:5px}@media(max-width:620px){.reaction-space{min-height:310px}}
</style><script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script><script defer src="/_vercel/insights/script.js"></script></head><body><main class="shell"><header><a class="brand" href="/" aria-label="Tools etc. home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools etc.</span></a><a class="back" href="/">All tools</a></header><section class="hero"><div class="eyebrow">Skills</div><h1>Reaction Time Test</h1></section><section class="panel"><button id="reactionSpace" class="reaction-space" type="button" aria-label="Reaction time test. Click to start, wait for green, then click again"><span id="reactionBig" class="big">Click to start</span><span id="reactionSmall" class="small">Wait for green before clicking again</span></button><div class="result-box" aria-live="polite"><div id="reactionResult" class="result-number">— ms</div><div id="reactionStatus" class="note">Click the white area to begin.</div></div></section></main>
<script>(()=>{const area=document.getElementById('reactionSpace'),big=document.getElementById('reactionBig'),small=document.getElementById('reactionSmall'),result=document.getElementById('reactionResult'),status=document.getElementById('reactionStatus');let state='ready',greenAt=0,timeout=null;function begin(){clearTimeout(timeout);state='waiting';area.className='reaction-space waiting';big.textContent='Wait for green…';small.textContent='Clicking now will be too early';result.textContent='— ms';status.textContent='Wait for the color to change.';const delay=1800+Math.random()*4200;timeout=setTimeout(()=>{if(state!=='waiting')return;state='go';greenAt=performance.now();area.className='reaction-space go';big.textContent='CLICK!';small.textContent='Click now';status.textContent=''} ,delay)}area.addEventListener('click',()=>{if(state==='ready'||state==='early'||state==='result'){begin();return}if(state==='waiting'){clearTimeout(timeout);state='early';area.className='reaction-space';big.textContent='Too soon!';small.textContent='Click to try again';status.textContent='That attempt does not count. Click to start another try.';return}if(state==='go'){const ms=Math.round(performance.now()-greenAt);state='result';area.className='reaction-space result';big.textContent=`${ms} ms`;small.textContent='Click to try again';result.textContent=`${ms} ms`;status.textContent=ms<200?'Very fast!':ms<300?'Nice reaction.':'Click the area to test again.'}});})();</script></body></html>
