<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="#635bff" name="theme-color"/><meta content="Test your reaction speed. Wait for green, then click as quickly as you can." name="description"/><link href="https://tools-etc.vercel.app/reaction-time-test" rel="canonical"/><title>Reaction Time Test — Tools etc.</title><style>
:root{--bg:#f7f7f8;--surface:#fff;--surface2:#f0f0f3;--text:#17171b;--muted:#6d6e76;--border:#dedee4;--accent:#635bff;--accent-soft:#eeecff}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.shell{width:min(900px,calc(100% - 32px));margin:auto;padding:22px 0 48px}header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 24px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--text);color:#fff}.brand-mark svg{width:18px;height:18px}.back{font-size:13px;color:var(--muted);padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}.back:hover{color:var(--text);background:var(--surface2)}.hero{text-align:center;padding:28px 0 26px}.eyebrow{font-size:12px;color:var(--muted);font-weight:750;margin-bottom:12px}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.05em;margin:0}.hero p{margin:12px auto 0;color:var(--muted);line-height:1.5;font-size:15px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:9px}.note{color:var(--muted);font-size:12px;line-height:1.5}.status{min-height:22px;margin-top:12px;color:var(--muted);font-size:13px;text-align:center}.primary{border:1px solid var(--text);border-radius:9px;padding:10px 14px;color:#fff;background:var(--text);font-weight:700}.primary:hover{background:#33333a}.analytics-spacer{height:1px}@media(max-width:620px){.shell{width:calc(100% - 22px);padding-top:14px}header{padding-bottom:14px}.hero{padding:24px 0 20px}.panel{padding:15px}}
</style>
<style>
.reaction-space{width:100%;min-height:390px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px solid #d8d8df;border-radius:12px;background:#fff;color:#17171b;text-align:center;user-select:none;touch-action:manipulation;transition:background-color .08s linear,color .08s linear}.reaction-space:hover{filter:brightness(.99)}.reaction-space.waiting{background:#e43d42;color:#fff;border-color:#e43d42}.reaction-space.go{background:#24b56a;color:#fff;border-color:#24b56a}.reaction-space.result{background:#24b56a;color:#fff;border-color:#24b56a}.reaction-space .big{font-size:clamp(32px,6vw,54px);font-weight:850;letter-spacing:-.05em}.reaction-space .small{font-size:14px;opacity:.82}.result-box{margin-top:14px;text-align:center;min-height:42px;display:flex;flex-direction:column;justify-content:center;gap:4px}.result-number{font-size:30px;font-weight:850;letter-spacing:-.04em}.status{margin-top:5px}@media(max-width:620px){.reaction-space{min-height:310px}}


/* Tools etc. shared page chrome */
header.site-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;padding:8px 0 24px!important;margin:0!important;width:min(1180px,calc(100vw - 32px))!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important}
header.site-header .brand{display:inline-flex!important;align-items:center!important;gap:11px!important;margin:0!important;font-family:inherit!important;font-size:19px!important;font-weight:750!important;letter-spacing:-.03em!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important}
header.site-header .brand-mark{width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:10px!important;background:var(--text)!important;color:#fff!important;flex:0 0 auto!important;box-shadow:none!important}
header.site-header .brand-mark svg{width:18px!important;height:18px!important}
header.site-header .back{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;padding:10px 12px!important;border:1px solid var(--border)!important;border-radius:10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:14px!important;font-weight:650!important;line-height:1.2!important;text-decoration:none!important;white-space:nowrap!important}
header.site-header .back:hover,header.site-header .back:focus-visible{background:var(--surface)!important;color:var(--text)!important;outline:none!important}
header.site-header .back svg{display:block!important;width:16px!important;height:16px!important;flex:0 0 auto!important;transform:none!important}
.hero{padding:34px 0 24px!important;text-align:center!important}
.hero h1,h1{margin:0!important;font-family:inherit!important;font-size:clamp(34px,5.5vw,54px)!important;line-height:1!important;letter-spacing:-.05em!important;font-weight:800!important}
button{font-family:inherit}
@media(max-width:620px){header.site-header{padding:4px 0 18px!important}header.site-header .brand{margin:0!important;font-size:18px!important}header.site-header .back{font-size:14px!important;padding:9px 10px!important}.hero{padding:28px 0 20px!important}}

/* Shared history controls */
.history-head button{appearance:none!important;border:1px solid var(--border)!important;border-radius:10px!important;padding:8px 10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;cursor:pointer!important;transition:background .16s ease,color .16s ease,border-color .16s ease!important}
.history-head button:hover,.history-head button:focus-visible{background:var(--surface2)!important;color:var(--text)!important;outline:none!important}
</style><script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script><script defer="" src="/_vercel/insights/script.js"></script></head><body><main class="shell"><header class="site-header"><a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a><a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></header><section class="hero"><h1>Reaction Time Test</h1></section><section class="panel"><button aria-label="Reaction time test. Click to start, wait for green, then click again" class="reaction-space" id="reactionSpace" type="button"><span class="big" id="reactionBig">Click to start</span><span class="small" id="reactionSmall"></span></button><div aria-live="polite" class="result-box"><div class="result-number" id="reactionResult">— ms</div></div></section></main>
<script>(()=>{const area=document.getElementById('reactionSpace'),big=document.getElementById('reactionBig'),small=document.getElementById('reactionSmall'),result=document.getElementById('reactionResult');let state='ready',greenAt=0,timeout=null;function begin(){clearTimeout(timeout);state='waiting';area.className='reaction-space waiting';big.textContent='Wait for green…';small.textContent='';result.textContent='— ms';const delay=1000+Math.random()*3000;timeout=setTimeout(()=>{if(state!=='waiting')return;state='go';greenAt=performance.now();area.className='reaction-space go';big.textContent='CLICK!';small.textContent='Click now';status.textContent=''} ,delay)}area.addEventListener('click',()=>{if(state==='ready'||state==='early'||state==='result'){begin();return}if(state==='waiting'){clearTimeout(timeout);state='early';area.className='reaction-space';big.textContent='Try again';small.textContent='';return}if(state==='go'){const ms=Math.round(performance.now()-greenAt);state='result';area.className='reaction-space result';big.textContent=`${ms} ms`;small.textContent='Click to try again';result.textContent=`${ms} ms`;status.textContent=''}});})();</script></body></html>
