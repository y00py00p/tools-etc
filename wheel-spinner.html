.wheel-stage{position:relative;width:min(100%,500px);aspect-ratio:1;margin:0 auto;display:grid;place-items:center;isolation:isolate}#wheel{width:100%;height:100%;display:block;transform:rotate(0deg);filter:drop-shadow(0 4px 9px rgba(20,20,30,.08));transition:none!important}.wheel-pointer{position:absolute;top:-1px;left:50%;width:0;height:0;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:27px solid var(--text);border-bottom:0;z-index:4;filter:drop-shadow(0 2px 2px rgba(0,0,0,.16))}.wheel-center-btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92px;height:92px;border:7px solid #fff;border-radius:50%;background:var(--text);color:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);z-index:5;padding:7px;display:grid;place-items:center;text-align:center;font-size:14px;line-height:1.1;font-weight:800;overflow-wrap:anywhere;word-break:break-word}.wheel-center-btn:hover:not(:disabled){background:#32323a}.wheel-center-btn:disabled{cursor:wait;opacity:.9}.wheel-center-btn.has-result{background:var(--accent);font-size:clamp(10px,1.7vw,14px)}.wheel-center-btn.has-result:hover{background:#5148f0}

<body>
<div class="shell">
<header class="site-header"><a class="brand" href="/" aria-label="Tools etc. home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools etc.</span></a><a class="back" href="/" aria-label="All tools"><span>All tools</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></header>
<section class="hero"><h1>Wheel Spinner</h1></section>
<section class="layout">
  <div class="panel wheel-panel">
    <div class="panel-head"><h2 class="panel-title">Spin the wheel</h2><span id="itemCount" class="count">0 items</span></div>
    <div class="wheel-stage">
      <canvas id="wheel" width="1000" height="1000" aria-label="Random choice wheel"></canvas>
      <div id="pointer" class="wheel-pointer" aria-hidden="true"></div>
      <button id="spin" class="wheel-center-btn" type="button">Spin</button>
      <div id="confettiLayer" class="confetti-layer" aria-hidden="true"></div>
    </div>
    <div class="spin-tools"><button id="soundToggle" class="sound-btn" type="button" aria-pressed="false" title="Mute wheel sounds">Mute</button></div>
    <div id="spinError" class="spin-error" aria-live="polite"></div>
  </div>
  <div class="panel editor">
    <div class="editor-top"><h2 class="panel-title">Wheel items</h2><button id="clearItems" class="subtle-btn danger" type="button">Clear all items</button></div>
    <div id="items" class="items"></div>
    <button id="addItem" class="add-btn" type="button">+ Add item</button>
    <p class="limit-note">Limit: 100 items.</p>
  </div>
</section>
<section class="panel history">
  <div class="history-head"><h2 class="panel-title">History</h2><button id="clearHistory" class="subtle-btn" type="button">Clear all history</button></div>
  <div id="historyList" class="history-list"></div>
</section>
</div>
<script>
(() => {
  'use strict';
  const MAX_ITEMS = 100, MAX_HISTORY = 50;
  const STORAGE_KEY = 'toolsEtcWheelSpinnerStateV2';
  const LEGACY_KEY = 'toolsEtcWheelSpinnerStateV1';
  const COLORS = ['#5B8FF9', '#F6BD16', '#61DDAA', '#F08BB4'];
  const $ = id => document.getElementById(id);
  const canvas = $('wheel'), ctx = canvas.getContext('2d');
  const itemsEl = $('items'), itemCountEl = $('itemCount'), historyListEl = $('historyList');
  const spinBtn = $('spin'), muteBtn = $('soundToggle'), pointer = $('pointer');
  const confettiLayer = $('confettiLayer'), spinError = $('spinError');
  let items = [], history = [], rotation = 0, spinning = false, muted = false, audioContext = null, animationFrame = 0;
  const SPIN_DURATION_MS = 3800;
  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  const round1 = n => Math.round((n + Number.EPSILON) * 10) / 10;
  const fmtPct = n => round1(n).toFixed(1);
  const parsedPercent = value => {
    if (value === '' || value == null) return null;
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
  };
  const defaultItems = () => [1,2,3,4].map(n => ({id:uid(),text:`Item ${n}`,percent:''}));

  function loadState() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch {}
    if (!saved) { try { saved = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null'); } catch {} }
    if (saved && Array.isArray(saved.items)) {
      items = saved.items.slice(0, MAX_ITEMS).map((item, i) => {
        const existingName = String(item.text ?? '');
        const convertedName = existingName.replace(/^Option (\d+)$/, 'Item $1');
        let percent = item.percent == null ? '' : String(item.percent).trim();
        if (percent !== '' && (!Number.isFinite(Number(percent)) || Number(percent) < 0.1)) percent = '';
        return {id:String(item.id || uid()), text:convertedName || `Item ${i+1}`, percent};
      });
      history = Array.isArray(saved.history) ? saved.history.slice(0, MAX_HISTORY).map(x => ({text:String(x.text ?? ''),time:String(x.time ?? '')})) : [];
      muted = saved.muted === true || saved.soundEnabled === false;
    } else {
      items = defaultItems(); history = []; muted = false;
    }
    renderItems(); renderHistory(); drawWheel(); updateMuteButton();
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({items,history,muted})); } catch {}
  }
  function rawEnteredValues() {
    return items.map(item => {
      const p = parsedPercent(item.percent);
      return p === null ? null : Math.max(0.1, Math.min(100, p));
    });
  }
  function effectivePercentages() {
    if (!items.length) return [];
    const raw = rawEnteredValues();
    const fixedSum = raw.reduce((sum,v)=>sum+(v===null?0:v),0);
    const blanks = raw.filter(v=>v===null).length;
    if (fixedSum > 100 + 1e-7) return {values:raw.map(v=>v===null?0:v),valid:false,message:'Percentages cannot exceed 100%. Leave unassigned entries blank to share the remainder.'};
    if (blanks > 0) {
      const remainder = Math.max(0,100-fixedSum);
      if (remainder + 1e-7 < blanks*0.1) return {values:raw.map(v=>v===null?0:v),valid:false,message:'Each item needs at least 0.1%.'};
      const share = remainder / blanks;
      return {values:raw.map(v=>v===null?share:v),valid:true,message:''};
    }
    const total = raw.reduce((sum,v)=>sum+(v||0),0);
    if (Math.abs(total-100) > 0.051) return {values:raw.map(v=>(v||0)*100/total),valid:false,message:'The entered percentages must add up to 100%. Leave any unassigned percentages blank to split the remainder.'};
    // Round-off can create a hundredth-point difference; normalize it away.
    return {values:raw.map(v=>(v||0)*100/total),valid:true,message:''};
  }
  function maxAllowed(index, candidate='') {
    let otherFixed = 0, otherBlank = 0;
    items.forEach((item,i)=>{
      if (i === index) return;
      const value = parsedPercent(item.percent);
      if (value === null) otherBlank++;
      else otherFixed += Math.max(0.1, Math.min(100,value));
    });
    return round1(Math.max(0.1, 100 - otherFixed - 0.1*otherBlank));
  }
  function clampTypedPercent(index, raw) {
    const parsed = parsedPercent(raw);
    if (parsed === null) return '';
    const max = maxAllowed(index);
    return fmtPct(Math.max(0.1, Math.min(parsed,max)));
  }
  function updateSpinEligibility() {
    const effective = effectivePercentages();
    spinBtn.disabled = spinning || items.length === 0 || !effective.valid || effective.values.every(v=>v<=0);
    spinError.textContent = '';
    $('addItem').disabled = spinning || items.length >= MAX_ITEMS;
    $('clearItems').disabled = spinning || items.length === 0;
    for (const el of itemsEl.querySelectorAll('input,button')) el.disabled = spinning;
  }
  function renderItems() {
    itemsEl.innerHTML = '';
    itemCountEl.textContent = `${items.length} ${items.length===1?'item':'items'}`;
    const effective = effectivePercentages();
    items.forEach((item,index)=>{
      const row=document.createElement('div'); row.className='item-row';
      const dot=document.createElement('span'); dot.className='color-dot'; dot.style.background=COLORS[index%COLORS.length]; dot.title=`Section ${index%COLORS.length+1}`;
      const name=document.createElement('input'); name.className='field'; name.type='text'; name.maxLength=120; name.value=item.text; name.placeholder=`Item ${index+1}`; name.setAttribute('aria-label',`Item ${index+1}`);
      name.addEventListener('input',()=>{item.text=name.value;saveState();drawWheel();});
      const wrap=document.createElement('div'); wrap.className='prob-wrap';
      const percent=document.createElement('input'); percent.className='field prob'; percent.type='text'; percent.inputMode='decimal'; percent.maxLength=7; percent.value=item.percent; percent.placeholder=effective.values[index]===undefined?'':fmtPct(effective.values[index]); percent.setAttribute('aria-label',`Percentage for Item ${index+1}`); percent.title='Enter a percentage; leave blank to split remaining percentage equally.';
      percent.addEventListener('input',()=>{
        // Store the raw keystrokes without re-rendering, so multi-digit edits remain easy.
        item.percent=percent.value.trim(); saveState(); drawWheel(); refreshPercentPlaceholders(index); updateSpinEligibility();
      });
      percent.addEventListener('blur',()=>{
        const raw=percent.value.trim();
        if(raw===''){item.percent='';percent.value='';}
        else {item.percent=clampTypedPercent(index,raw);percent.value=item.percent;}
        saveState(); renderItems(); drawWheel();
      });
      wrap.appendChild(percent);
      const remove=document.createElement('button'); remove.className='remove-btn'; remove.type='button'; remove.setAttribute('aria-label',`Remove Item ${index+1}`); remove.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
      remove.addEventListener('click',()=>{if(spinning)return;items=items.filter(x=>x.id!==item.id);saveState();renderItems();drawWheel();});
      row.append(dot,name,wrap,remove); itemsEl.appendChild(row);
    });
    updateSpinEligibility();
  }
  function refreshPercentPlaceholders(activeIndex=-1) {
    const effective=effectivePercentages();
    [...itemsEl.querySelectorAll('.prob')].forEach((input,index)=>{
      if(index!==activeIndex && items[index]?.percent==='') input.placeholder=effective.values[index]===undefined?'':fmtPct(effective.values[index]);
    });
  }
  function buildGeometry() {
    const effective=effectivePercentages();
    const weights=effective.values.map(v=>Number.isFinite(v)&&v>0?v:0);
    const total=weights.reduce((a,b)=>a+b,0), segments=[];
    let cursor=0, remaining=weights.filter(v=>v>0).length;
    weights.forEach((weight,index)=>{
      let span=total>0?360*weight/total:0;
      if(weight>0){remaining--;if(remaining===0)span=360-cursor;}
      segments.push({index,weight,start:cursor,end:cursor+span,span}); cursor+=span;
    });
    return {segments,weights,total,valid:effective.valid};
  }
  function drawWheel() {
    const w=canvas.width,h=canvas.height,cx=w/2,cy=h/2,r=Math.min(w,h)/2-18;
    ctx.clearRect(0,0,w,h);
    const geometry=buildGeometry();
    if(!items.length || geometry.total<=0){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle='#ececf1';ctx.fill();ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.stroke();return;}
    geometry.segments.forEach(segment=>{
      if(segment.span<=0)return;
      const start=-Math.PI/2+segment.start*Math.PI/180,end=-Math.PI/2+segment.end*Math.PI/180;
      ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,end);ctx.closePath();ctx.fillStyle=COLORS[segment.index%COLORS.length];ctx.fill();ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.stroke();
    });
    if(items.length<=24){geometry.segments.forEach(segment=>{
      if(segment.span*Math.PI/180<=0.115)return;
      const center=-Math.PI/2+(segment.start+segment.span/2)*Math.PI/180;
      const source=items[segment.index].text.trim()||`Item ${segment.index+1}`;
      const label=source.length>18?source.slice(0,17)+'…':source;
      ctx.save();ctx.translate(cx+Math.cos(center)*r*.66,cy+Math.sin(center)*r*.66);ctx.rotate(center+Math.PI/2);ctx.fillStyle='rgba(255,255,255,.97)';ctx.font='700 24px Inter,Arial,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor='rgba(0,0,0,.15)';ctx.shadowBlur=3;ctx.fillText(label,0,0);ctx.restore();
    });}
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.lineWidth=12;ctx.strokeStyle='#fff';ctx.stroke();
  }
  function uniformAngle() {
    if (window.crypto && window.crypto.getRandomValues) {
      const data=new Uint32Array(1);window.crypto.getRandomValues(data);return (data[0]/4294967296)*360;
    }
    return Math.random()*360;
  }
  function chooseWinner(geometry) {
    const landingAngle=uniformAngle();
    let seg=geometry.segments.find(segment=>segment.span>0 && landingAngle>=segment.start && landingAngle<segment.end);
    if(!seg)seg=[...geometry.segments].reverse().find(segment=>segment.span>0)||null;
    return seg?{selected:seg.index,landingAngle}:null;
  }
  function renderHistory() {
    historyListEl.innerHTML='';
    if(!history.length){historyListEl.innerHTML='<div class="history-empty">No spins yet.</div>';return;}
    history.slice(0,MAX_HISTORY).forEach(entry=>{
      const row=document.createElement('div');row.className='history-item';
      const value=document.createElement('span');value.className='history-value';value.textContent=entry.text;
      const time=document.createElement('span');time.className='history-time';time.textContent=entry.time;
      row.append(value,time);historyListEl.appendChild(row);
    });
  }
  function addHistory(value) {
    history.unshift({text:value,time:new Date().toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})});history=history.slice(0,MAX_HISTORY);renderHistory();saveState();
  }
  function updateMuteButton() { muteBtn.textContent=muted?'Unmute':'Mute';muteBtn.setAttribute('aria-pressed',String(muted));muteBtn.title=muted?'Unmute wheel sounds':'Mute wheel sounds'; }
  function getAudioContext() {
    if(muted)return null;const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return null;
    if(!audioContext)audioContext=new AudioContextClass();if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});return audioContext;
  }
  function playTick() {
    if(muted)return;const ac=getAudioContext();if(!ac)return;const start=ac.currentTime;const osc=ac.createOscillator(),gain=ac.createGain();osc.type='square';osc.frequency.setValueAtTime(1150,start);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(.014,start+.003);gain.gain.exponentialRampToValueAtTime(.0001,start+.018);osc.connect(gain);gain.connect(ac.destination);osc.start(start);osc.stop(start+.02);
  }
  function cubic(t,p1,p2){const u=1-t;return 3*u*u*t*p1+3*u*t*t*p2+t*t*t;}
  function easing(progress){let lo=0,hi=1,t=progress;for(let i=0;i<14;i++){if(cubic(t,.12,.18)<progress)lo=t;else hi=t;t=(lo+hi)/2;}return cubic(t,.78,1);}
  function playCrossedBoundaries(prev,now,boundaries){
    if(muted||now<=prev)return;const crossed=[];
    for(const boundary of boundaries){let turn=Math.floor((prev+boundary)/360)+1;let pos=360*turn-boundary;while(pos<=now+1e-7){if(pos>prev+1e-7)crossed.push(pos);turn++;pos=360*turn-boundary;}}
    crossed.sort((a,b)=>a-b);crossed.forEach(()=>playTick());
  }
  function burstConfetti(){
    confettiLayer.innerHTML='';const colors=['#635bff','#f6bd16','#61ddaa','#f08bb4','#5b8ff9','#ff8b5e'];
    for(let i=0;i<48;i++){const piece=document.createElement('span');piece.className='confetti-piece';piece.style.background=colors[i%colors.length];piece.style.setProperty('--dx',`${(Math.random()-.5)*Math.min(520,window.innerWidth*.8)}px`);piece.style.setProperty('--dy',`${100+Math.random()*280}px`);piece.style.setProperty('--spin',`${(Math.random()-.5)*900}deg`);piece.style.animationDelay=`${Math.random()*.12}s`;confettiLayer.appendChild(piece);}
    window.setTimeout(()=>{confettiLayer.innerHTML='';},1250);
  }
  function finishSpin(selected){
    const label=items[selected]?.text.trim()||`Item ${selected+1}`;
    spinBtn.textContent=label;spinBtn.title=`Result: ${label}. Spin again.`;spinBtn.classList.add('has-result','confetti-motion');pointer.classList.add('pointer-pulse');addHistory(label);burstConfetti();
    spinning=false;animationFrame=0;spinBtn.disabled=false;spinBtn.setAttribute('aria-label',`Result ${label}. Spin again`);renderItems();
    window.setTimeout(()=>spinBtn.classList.remove('confetti-motion'),500);
  }
  function spin(){
    if(spinning||!items.length)return;
    const geometry=buildGeometry();
    if(!geometry.valid){spinError.textContent='Check the percentages. Leave any unassigned fields blank to share the remainder.';return;}
    if(!geometry.total||geometry.weights.every(v=>v<=0))return;
    const selection=chooseWinner(geometry);if(!selection)return;
    const {selected,landingAngle}=selection; // Winner decided before motion begins.
    const boundaries=geometry.segments.filter(s=>s.span>0).map(s=>s.start);
    const currentMod=((rotation%360)+360)%360;const targetMod=((360-landingAngle)%360+360)%360;
    let delta=targetMod-currentMod;if(delta<0)delta+=360;delta+=360*5;
    spinning=true;spinError.textContent='';updateSpinEligibility();if(!muted)getAudioContext();
    spinBtn.classList.remove('has-result','confetti-motion');spinBtn.textContent='…';spinBtn.title='Spinning';pointer.classList.remove('pointer-pulse');
    const startRotation=rotation,targetRotation=startRotation+delta,startedAt=performance.now();let last=startRotation;
    function animate(now){
      if(!spinning)return;const progress=Math.min(1,Math.max(0,(now-startedAt)/SPIN_DURATION_MS));const visual=startRotation+delta*easing(progress);
      playCrossedBoundaries(last,visual,boundaries);canvas.style.transform=`rotate(${visual}deg)`;last=visual;
      if(progress<1){animationFrame=requestAnimationFrame(animate);}else{canvas.style.transform=`rotate(${targetRotation}deg)`;rotation=targetRotation;finishSpin(selected);}
    }
    animationFrame=requestAnimationFrame(animate);
  }
  $('addItem').addEventListener('click',()=>{if(spinning||items.length>=MAX_ITEMS)return;items.push({id:uid(),text:`Item ${items.length+1}`,percent:''});saveState();renderItems();drawWheel();itemsEl.querySelector('.item-row:last-child input')?.focus();});
  $('clearItems').addEventListener('click',()=>{if(spinning||!items.length)return;items=[];saveState();spinBtn.textContent='Spin';spinBtn.title='Spin the wheel';spinBtn.classList.remove('has-result');spinError.textContent='';renderItems();drawWheel();});
  $('clearHistory').addEventListener('click',()=>{history=[];saveState();renderHistory();});
  spinBtn.addEventListener('click',spin);
  muteBtn.addEventListener('click',()=>{muted=!muted;if(!muted&&spinning)getAudioContext();updateMuteButton();saveState();});
  loadState();
})();
</script>
