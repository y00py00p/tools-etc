</head><body><div class="shell"><header class="topbar"><a class="brand" href="/"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools, etc.</span></a><a class="back" href="/">All tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></header><section class="hero"><span class="eyebrow">Tools, etc.</span><h1>Color Picker</h1><p>Find and copy HEX, RGB, and HSL color values quickly.</p></section><main class="card tool-card"><div class="grid grid-2"><div><label class="label" for="hex">HEX</label><input class="field mono" id="hex" value="#635BFF" maxlength="7"><div class="controls" style="margin-top:12px"><button class="btn primary" id="apply">Apply</button><button class="btn" id="copyHex">Copy HEX</button></div><div class="slider-wrap"><div class="slider-head"><span class="label" style="margin:0">Hue</span><span class="slider-value" id="hueValue">238°</span></div><input class="color-slider hue-slider" id="hueSlider" type="range" min="0" max="360" value="238" aria-label="Hue"></div><div class="slider-wrap"><div class="slider-head"><span class="label" style="margin:0">Darkness</span><span class="slider-value" id="darknessValue">0%</span></div><input class="color-slider darkness-slider" id="darknessSlider" type="range" min="0" max="100" value="0" aria-label="Darkness"></div></div><div><div id="preview" style="height:150px;border-radius:18px;border:1px solid var(--border);background:#635BFF"></div></div></div><div class="result" id="values"></div></main><div class="footer-note">Runs locally in your browser. Nothing is uploaded.</div></div><script>const hex=document.getElementById('hex'),preview=document.getElementById('preview'),values=document.getElementById('values'),hueSlider=document.getElementById('hueSlider'),hueValue=document.getElementById('hueValue'),darknessSlider=document.getElementById('darknessSlider'),darknessValue=document.getElementById('darknessValue');let hue=238,sat=64,value=100,darkness=0,raf=0;function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);if(h<0)h+=360}const s=max?d/max*100:0;return [h,s,max*100]}function hsvToRgb(h,s,v){h=((h%360)+360)%360;s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=0,l=(max+min)/2;if(d){s=d/(1-Math.abs(2*l-1));switch(max){case r:h=60*(((g-b)/d)%6);break;case g:h=60*((b-r)/d+2);break;default:h=60*((r-g)/d+4)}}if(h<0)h+=360;return [Math.round(h),Math.round(s*100),Math.round(l*100)]}function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}function render(){raf=0;const effectiveV=value*(1-darkness/100),[r,g,b]=hsvToRgb(hue,sat,effectiveV),v=rgbToHex(r,g,b),[hh,ss,ll]=rgbToHsl(r,g,b);hex.value=v;preview.style.background=v;hueValue.textContent=Math.round(hue)+'°';darknessValue.textContent=Math.round(darkness)+'%';darknessSlider.style.setProperty('--dark-color',rgbToHex(...hsvToRgb(hue,sat,value)));values.innerHTML=`<b>RGB</b> ${r}, ${g}, ${b}<br><br><b>HSL</b> ${hh}, ${ss}%, ${ll}%`}function schedule(){if(!raf)raf=requestAnimationFrame(render)}function show(){const v=hex.value.trim();if(!/^#[0-9a-f]{6}$/i.test(v)){values.textContent='Enter a 6-digit HEX color.';return}const r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);[hue,sat,value]=rgbToHsv(r,g,b);darkness=0;hueSlider.value=Math.round(hue);darknessSlider.value='0';render()}document.getElementById('apply').onclick=show;document.getElementById('copyHex').onclick=async()=>{try{await navigator.clipboard.writeText(hex.value)}catch{}};hueSlider.addEventListener('input',()=>{hue=Number(hueSlider.value);schedule()});darknessSlider.addEventListener('input',()=>{darkness=Number(darknessSlider.value);schedule()});show();</script></body></html>
