100" min="0" type="range" value="0"/></div></div><div><div id="preview" style="height:150px;border-radius:18px;border:1px solid var(--border);background:#635BFF"></div></div></div><div class="result" id="values"></div></main></div><script>const hex=document.getElementById('hex'),preview=document.getElementById('preview'),values=document.getElementById('values'),hueSlider=document.getElementById('hueSlider'),hueValue=document.getElementById('hueValue'),darknessSlider=document.getElementById('darknessSlider'),darknessValue=document.getElementById('darknessValue'),whitenessSlider=document.getElementById('whitenessSlider'),whitenessValue=document.getElementById('whitenessValue');let hue=238,sat=64,value=100,darkness=0,whiteness=0,raf=0;function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0;if(d){if(max===r)h=60*(((g-b)/d)%6);else if(max===g)h=60*((b-r)/d+2);else h=60*((r-g)/d+4);if(h<0)h+=360}const s=max?d/max*100:0;return [h,s,max*100]}function hsvToRgb(h,s,v){h=((h%360)+360)%360;s/=100;v/=100;const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return [Math.round((r+m)*255),Math.round((g+m)*255),Math.round((b+m)*255)]}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;let h=0,s=0,l=(max+min)/2;if(d){s=d/(1-Math.abs(2*l-1));switch(max){case r:h=60*(((g-b)/d)%6);break;case g:h=60*((b-r)/d+2);break;default:h=60*((r-g)/d+4)}}if(h<0)h+=360;return [Math.round(h),Math.round(s*100),Math.round(l*100)]}function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('').toUpperCase()}function render(){raf=0;const effectiveV=value*(1-darkness/100),base=hsvToRgb(hue,sat,effectiveV),whiteMix=whiteness/100,r=Math.round(base[0]+(255-base[0])*whiteMix),g=Math.round(base[1]+(255-base[1])*whiteMix),b=Math.round(base[2]+(255-base[2])*whiteMix),v=rgbToHex(r,g,b),[hh,ss,ll]=rgbToHsl(r,g,b);hex.value=v;preview.style.background=v;hueValue.textContent=Math.round(hue)+'°';darknessValue.textContent=Math.round(darkness)+'%';whitenessValue.textContent=Math.round(whiteness)+'%';darknessSlider.style.setProperty('--dark-color',rgbToHex(...hsvToRgb(hue,sat,value)));whitenessSlider.style.setProperty('--white-color',rgbToHex(...hsvToRgb(hue,sat,effectiveV)));values.innerHTML=`<b>RGB</b> ${r}, ${g}, ${b}<br><br><b>HSL</b> ${hh}, ${ss}%, ${ll}%`}function schedule(){if(!raf)raf=requestAnimationFrame(render)}function show(){const v=hex.value.trim();if(!/^#[0-9a-f]{6}$/i.test(v)){values.textContent='Enter a 6-digit HEX color.';return}const r=parseInt(v.slice(1,3),16),g=parseInt(v.slice(3,5),16),b=parseInt(v.slice(5,7),16);[hue,sat,value]=rgbToHsv(r,g,b);darkness=0;whiteness=0;hueSlider.value=Math.round(hue);darknessSlider.value='0';whitenessSlider.value='0';render()}hex.addEventListener('input',()=>{let v=hex.value.toUpperCase();if(v.startsWith('#'))v=v.slice(1);v=v.replace(/[^0-9A-F]/g,'').slice(0,6);hex.value='#'+v;try{hex.setSelectionRange(hex.value.length,hex.value.length)}catch{}});hex.addEventListener('keydown',e=>{if((e.key==='Backspace'||e.key==='Delete')&&hex.selectionStart<=1&&hex.selectionEnd<=1){e.preventDefault();try{hex.setSelectionRange(1,1)}catch{}}});document.getElementById('apply').onclick=show;document.getElementById('copyHex').onclick=async()=>{try{await navigator.clipboard.writeText(hex.value)}catch{}};hueSlider.addEventListener('input',()=>{hue=Number(hueSlider.value);schedule()});darknessSlider.addEventListener('input',()=>{darkness=Number(darknessSlider.value);schedule()});whitenessSlider.addEventListener('input',()=>{whiteness=Number(whitenessSlider.value);schedule()});show();</script>
