<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="#635bff" name="theme-color"/><meta content="Test your clicking speed with a 1-second, 5-second, 10-second, or 1-minute CPS test." name="description"/><link href="https://tools-etc.vercel.app/cps-test" rel="canonical"/><title>CPS Test — Tools etc.</title><style>
:root{--bg:#f7f7f8;--surface:#fff;--surface2:#f0f0f3;--text:#17171b;--muted:#6d6e76;--border:#dedee4;--accent:#635bff;--accent-soft:#eeecff}
*{box-sizing:border-box}html{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--bg)}body{margin:0;min-height:100vh}button{font:inherit;cursor:pointer}a{color:inherit;text-decoration:none}.shell{width:min(900px,calc(100% - 32px));margin:auto;padding:22px 0 48px}header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 24px}.brand{display:inline-flex;align-items:center;gap:10px;font-size:18px;font-weight:750;letter-spacing:-.03em}.brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--text);color:#fff}.brand-mark svg{width:18px;height:18px}.back{font-size:13px;color:var(--muted);padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:#fff}.back:hover{color:var(--text);background:var(--surface2)}.hero{text-align:center;padding:28px 0 26px}.eyebrow{font-size:12px;color:var(--muted);font-weight:750;margin-bottom:12px}.hero h1{font-size:clamp(34px,6vw,54px);line-height:1;letter-spacing:-.05em;margin:0}.hero p{margin:12px auto 0;color:var(--muted);line-height:1.5;font-size:15px}.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px}.label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:9px}.note{color:var(--muted);font-size:12px;line-height:1.5}.status{display:none!important}.primary{border:1px solid var(--text);border-radius:9px;padding:10px 14px;color:#fff;background:var(--text);font-weight:700}.primary:hover{background:#33333a}.analytics-spacer{height:1px}@media(max-width:620px){.shell{width:calc(100% - 22px);padding-top:14px}header{padding-bottom:14px}.hero{padding:24px 0 20px}.panel{padding:15px}}
</style>
<style>
.duration-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}.duration{min-width:68px;border:1px solid var(--border);border-radius:8px;padding:9px 12px;background:#fff;color:var(--text);font-size:13px;font-weight:700}.duration[aria-pressed="true"]{border-color:var(--text);background:var(--text);color:#fff}.test-space{position:relative;overflow:hidden;width:100%;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:1px solid #d8d8df;border-radius:12px;background:#fff;color:var(--text);user-select:none;touch-action:manipulation;text-align:center}.test-space:hover{background:#fafaff}.test-space.running{background:#eeecff;border-color:#c8c4ff}.test-space.done{background:#f0f0f3}.space-main{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.04em}.space-sub{font-size:14px;color:var(--muted)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{padding:14px;border:1px solid var(--border);border-radius:10px}.stat-label{font-size:11px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.04em}.stat-value{font-size:25px;font-weight:800;letter-spacing:-.04em;margin-top:5px}.progress{height:5px;background:#e5e5eb;border-radius:99px;overflow:hidden;width:min(250px,70%);margin-top:10px}.progress span{display:block;width:0;height:100%;background:var(--accent)}.confetti-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none}.confetti-piece{position:absolute;top:-12px;width:7px;height:11px;border-radius:2px;opacity:0;animation:confettiFall var(--fall-time) cubic-bezier(.18,.62,.35,1) forwards;will-change:transform,opacity}@keyframes confettiFall{0%{opacity:1;transform:translate3d(0,-12px,0) rotate(0)}100%{opacity:0;transform:translate3d(var(--drift),var(--fall),0) rotate(var(--spin))}}@media(max-width:620px){.test-space{min-height:260px}.duration{flex:1}}


/* Tools etc. shared page chrome */
header.site-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;padding:8px 0 24px!important;margin:0!important;width:min(1180px,calc(100vw - 32px))!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important}
header.site-header .brand{display:inline-flex!important;align-items:center!important;gap:11px!important;margin:0!important;font-family:inherit!important;font-size:19px!important;font-weight:750!important;letter-spacing:-.03em!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important}
header.site-header .brand-mark{width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:10px!important;background:var(--text)!important;color:#fff!important;flex:0 0 auto!important;box-shadow:none!important}
header.site-header .brand-mark svg{width:18px!important;height:18px!important}
header.site-header .back{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;padding:10px 12px!important;border:1px solid var(--border)!important;border-radius:10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:14px!important;font-weight:650!important;line-height:1.2!important;text-decoration:none!important;white-space:nowrap!important}
header.site-header .back:hover,header.site-header .back:focus-visible{background:var(--surface)!important;color:var(--text)!important;outline:none!important}
header.site-header .back svg{display:block!important;width:16px!important;height:16px!important;flex:0 0 auto!important;transform:none!important}
.hero{padding:34px 0 24px!important;text-align:center!important}
.hero h1,h1{margin:0!important;font-family:inherit!important;font-size:clamp(34px,5.5vw,54px)!important;line-height:1!important;letter-spacing:-.05em!important;font-weight:800!important}
button{font-family:inherit}
@media(max-width:620px){header.site-header{padding:4px 0 18px!important}header.site-header .brand{margin:0!important;font-size:18px!important}header.site-header .back{font-size:14px!important;padding:9px 10px!important}.hero{padding:28px 0 20px!important}}

/* Shared history controls */
.history-head button{appearance:none!important;border:1px solid var(--border)!important;border-radius:10px!important;padding:8px 10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;cursor:pointer!important;transition:background .16s ease,color .16s ease,border-color .16s ease!important}
.history-head button:hover,.history-head button:focus-visible{background:var(--surface2)!important;color:var(--text)!important;outline:none!important}
</style><script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script><script defer="" src="/_vercel/insights/script.js"></script></head><body><main class="shell"><header class="site-header"><a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a><a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></header><section class="hero"><h1>CPS Test</h1></section><section class="panel"><div aria-label="Test duration" class="duration-row" role="group"><button aria-pressed="false" class="duration" data-duration="1" type="button">1 sec</button><button aria-pressed="true" class="duration" data-duration="5" type="button">5 sec</button><button aria-pressed="false" class="duration" data-duration="10" type="button">10 sec</button><button aria-pressed="false" class="duration" data-duration="60" type="button">1 minute</button></div><button aria-label="Click here to start and click repeatedly to test clicking speed" class="test-space" id="testSpace" type="button"><span class="space-main" id="spaceMain">Click to start</span><span class="space-sub" id="spaceSub">Then click as fast as you can</span><span aria-hidden="true" class="progress"><span id="progressBar"></span></span></button><div class="stats"><div class="stat"><div class="stat-label">Clicks</div><div class="stat-value" id="clickCount">0</div></div><div class="stat"><div class="stat-label">Clicks per second</div><div class="stat-value" id="cpsValue">—</div></div></div><div aria-live="polite" class="status" id="status"></div></section></main>
<script>
(() => {
  const area = document.getElementById('testSpace');
  const main = document.getElementById('spaceMain');
  const sub = document.getElementById('spaceSub');
  const countEl = document.getElementById('clickCount');
  const cpsEl = document.getElementById('cpsValue');
  const status = document.getElementById('status');
  const bar = document.getElementById('progressBar');
  const durationBtns = [...document.querySelectorAll('[data-duration]')];
  let duration = 5;
  let state = 'ready';
  let clicks = 0;
  let startAt = 0;
  let ticker = 0;
  let cooldownEndsAt = 0;

  function clearTimers() {
    clearInterval(ticker);
    ticker = 0;
  }

  function clearConfetti() {
    area.querySelector('.confetti-layer')?.remove();
  }

  function launchConfetti() {
    clearConfetti();
    const layer = document.createElement('span');
    layer.className = 'confetti-layer';
    layer.setAttribute('aria-hidden', 'true');
    const colors = ['#635bff', '#16a34a', '#f59e0b', '#ec4899', '#0ea5e9', '#f97316'];
    for (let i = 0; i < 44; i++) {
      const piece = document.createElement('span');
      piece.className = 'confetti-piece';
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[Math.floor(Math.random() * colors.length)];
      piece.style.setProperty('--drift', `${Math.round((Math.random() - 0.5) * 150)}px`);
      piece.style.setProperty('--fall', `${100 + Math.random() * 180}px`);
      piece.style.setProperty('--spin', `${Math.round((Math.random() - 0.5) * 1080)}deg`);
      piece.style.setProperty('--fall-time', `${0.7 + Math.random() * 0.65}s`);
      piece.style.animationDelay = `${Math.random() * 0.12}s`;
      layer.appendChild(piece);
    }
    area.appendChild(layer);
    window.setTimeout(() => layer.remove(), 1600);
  }

  function reset() {
    clearTimers();
    clearConfetti();
    state = 'ready';
    clicks = 0;
    startAt = 0;
    cooldownEndsAt = 0;
    countEl.textContent = '0';
    cpsEl.textContent = '—';
    main.textContent = 'Click to start';
    sub.textContent = 'Then click as fast as you can';
    status.textContent = '';
    bar.style.width = '0%';
    area.className = 'test-space';
  }

  durationBtns.forEach(btn => btn.addEventListener('click', () => {
    duration = Number(btn.dataset.duration);
    durationBtns.forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
    if (state !== 'cooldown') reset();
    // During the silent cooldown, preserve the just-finished result and simply
    // apply the new duration to the next test.
  }));

  function start() {
    clearTimers();
    clearConfetti();
    state = 'running';
    clicks = 1;
    startAt = performance.now();
    area.className = 'test-space running';
    main.textContent = 'Keep clicking!';
    sub.textContent = `${duration} second${duration === 1 ? '' : 's'} test`;
    countEl.textContent = String(clicks);
    cpsEl.textContent = '…';
    status.textContent = '';
    const endAt = startAt + duration * 1000;
    ticker = setInterval(() => {
      const now = performance.now();
      const left = Math.max(0, endAt - now);
      bar.style.width = `${Math.min(100, Math.max(0, (1 - left / (duration * 1000)) * 100))}%`;
      sub.textContent = `${(left / 1000).toFixed(2)} seconds left`;
      if (left <= 0) finish();
    }, 10);
  }

  function finish() {
    if (state !== 'running') return;
    clearTimers();
    state = 'cooldown';
    cooldownEndsAt = performance.now() + 3000;
    const cps = clicks / duration;
    const cpsText = cps.toFixed(2);
    area.className = 'test-space done';
    main.textContent = `${cpsText} CPS`;
    sub.textContent = `${clicks} click${clicks === 1 ? '' : 's'} in ${duration} second${duration === 1 ? '' : 's'}`;
    countEl.textContent = String(clicks);
    cpsEl.textContent = cpsText;
    status.textContent = '';
    bar.style.width = '100%';
    launchConfetti();
  }

  area.addEventListener('click', () => {
    if (state === 'cooldown') {
      if (performance.now() < cooldownEndsAt) return;
      state = 'ready';
    }
    if (state === 'running') {
      clicks++;
      countEl.textContent = String(clicks);
    } else if (state === 'ready') {
      start();
    }
  });
})();
</script></body></html>
