<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}a{color:inherit;text-decoration:none}.shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:24px 0 42px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:8px 0 28px}.brand{display:inline-flex;align-items:center;gap:11px;margin-left:clamp(2px,calc((100vw - 1132px)/2),40px);font-weight:750;letter-spacing:-.03em;font-size:19px}.brand-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:var(--text);color:#fff;flex:0 0 auto}.brand-mark svg{width:18px;height:18px}.back{display:inline-flex;align-items:center;gap:7px;color:var(--muted);font-size:14px;font-weight:650}.back svg{width:16px}.hero{padding:54px 0 28px}.eyebrow{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.75);color:var(--muted);font-size:12px;font-weight:700}.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.02;letter-spacing:-.055em;margin:16px 0 12px}.hero p{max-width:640px;color:var(--muted);font-size:16px;line-height:1.65;margin:0}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.tool-card{padding:22px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:12px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:#b42318}.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(99,91,255,.2);outline-offset:2px}textarea,input,select{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.label{display:block;font-size:12px;font-weight:750;color:var(--muted);margin:0 0 8px}.field{width:100%;padding:13px}.result{margin-top:14px;padding:18px;border-radius:16px;background:var(--surface2);border:1px solid var(--border)}.result strong{font-size:28px;letter-spacing:-.03em}.footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}.history{margin-top:16px;padding:16px;border:1px solid var(--border);border-radius:18px;background:var(--surface)}.history-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}.history-title{font-size:14px;font-weight:800}.history-list{max-height:230px;overflow:auto;display:grid;gap:8px;padding-right:2px}.history-empty{padding:8px 2px;color:var(--muted);font-size:13px}.history-item{padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2)}.history-equation{font-size:13px;font-weight:700;line-height:1.45;word-break:break-word}.history-answer{margin-top:3px;color:var(--muted);font-size:12px}.category{margin:16px 0 10px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}@media(max-width:760px){.shell{width:min(100% - 24px,1100px);padding-top:16px}.hero{padding:40px 0 22px}.grid-2{grid-template-columns:1fr}.topbar{align-items:flex-start}.back{font-size:13px}}

<body>
<div class="shell">
<header><a class="brand" href="/" aria-label="Tools, etc. home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"/><path d="M8.2 15h7.6"/></svg></span><span>Tools, etc.</span></a><a class="back" href="/">All tools <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></a></header>
<section class="hero"><span class="eyebrow">Tools, etc.</span><h1>Unit Converter</h1><p>Convert common metric and imperial units instantly.</p></section>
<main class="card tool-card">
<div class="grid grid-2">
<div><label class="label" for="from">From</label><select class="field" id="from"></select></div>
<div><label class="label" for="to">To</label><select class="field" id="to"></select></div>
<div><label class="label" for="value">Value</label><input class="field" id="value" type="number" inputmode="decimal" value="" step="any"></div>
</div>
<div class="controls" style="margin-top:18px"><button class="btn primary" id="convert">Convert</button></div>
<div class="result"><strong id="out"></strong><div class="muted small" id="unit"></div></div>
<div class="history">
<div class="history-head"><div class="history-title">History</div><button class="btn danger" id="clearHistory" type="button">Clear all</button></div>
<div class="history-list" id="historyList"></div>
</div>
</main>
<div class="footer-note">Runs locally in your browser. Nothing is uploaded.</div>
</div>
<script>
const UNITS={
 length:{label:'Length',units:{mm:{name:'Millimeters',factor:0.001},in:{name:'Inches',factor:0.0254},cm:{name:'Centimeters',factor:0.01},m:{name:'Meters',factor:1},ft:{name:'Feet',factor:0.3048},yd:{name:'Yards',factor:0.9144},km:{name:'Kilometers',factor:1000},mi:{name:'Miles',factor:1609.344}}},
 temperature:{label:'Temperature',units:{c:{name:'Celsius'},f:{name:'Fahrenheit'},k:{name:'Kelvin'}}},
 mass:{label:'Weight / Mass',units:{g:{name:'Grams',factor:0.001},oz:{name:'Ounces',factor:0.028349523125},kg:{name:'Kilograms',factor:1},lb:{name:'Pounds',factor:0.45359237},stone:{name:'Stone',factor:6.35029318},tonne:{name:'Tonnes',factor:1000},ton:{name:'Tons',factor:907.18474}}},
 volume:{label:'Volume',units:{ml:{name:'Milliliters',factor:0.001},floz:{name:'Fluid Ounces (US)',factor:0.0000295735295625},l:{name:'Liters',factor:1},gal:{name:'Gallons (US)',factor:3.785411784},qt:{name:'Quarts (US)',factor:0.946352946},cup:{name:'Cups (US)',factor:0.2365882365},tbsp:{name:'Tablespoons (US)',factor:0.01478676478125},tsp:{name:'Teaspoons (US)',factor:0.00492892159375}}},
 speed:{label:'Speed',units:{kmh:{name:'Kilometers per hour',factor:1},mph:{name:'Miles per hour',factor:1.609344},ms:{name:'Meters per second',factor:0.2777777777777778},fts:{name:'Feet per second',factor:0.3048},kn:{name:'Knots',factor:1.852}}},
 time:{label:'Time',units:{sec:{name:'Seconds',factor:1},min:{name:'Minutes',factor:60},hr:{name:'Hours',factor:3600},day:{name:'Days',factor:86400},week:{name:'Weeks',factor:604800},month:{name:'Months',factor:2629800},year:{name:'Years',factor:31556952}}},
 area:{label:'Area',units:{cm2:{name:'Square centimeters',factor:0.0001},in2:{name:'Square inches',factor:0.00064516},m2:{name:'Square meters',factor:1},ft2:{name:'Square feet',factor:0.09290304},km2:{name:'Square kilometers',factor:1000000},mi2:{name:'Square miles',factor:2589988.110336},acre:{name:'Acres',factor:4046.8564224},hectare:{name:'Hectares',factor:10000}}}
};
const byUnit={}; Object.entries(UNITS).forEach(([cat,data])=>Object.keys(data.units).forEach(id=>byUnit[id]={cat,...data.units[id]}));
const pairRules={
 length:[['mm','in'],['cm','in'],['m','ft'],['km','mi'],['ft','yd']],
 temperature:[['c','f'],['c','k'],['f','k']],
 mass:[['g','oz'],['kg','lb'],['kg','stone'],['lb','stone'],['tonne','ton']],
 volume:[['ml','floz'],['l','gal'],['l','qt'],['cup','ml'],['tbsp','ml'],['tsp','ml']],
 speed:[['kmh','mph'],['ms','kmh'],['mph','fts'],['kn','kmh'],['kn','mph']],
 time:[['sec','min'],['min','hr'],['hr','day'],['day','week'],['week','month'],['day','year']],
 area:[['cm2','in2'],['m2','ft2'],['km2','mi2'],['acre','hectare'],['ft2','acre']]
};
const from=document.getElementById('from'),to=document.getElementById('to'),value=document.getElementById('value'),out=document.getElementById('out'),unit=document.getElementById('unit');
let lastCategory='length';
function addOptions(){from.innerHTML='';to.innerHTML='';Object.entries(UNITS).forEach(([cat,data])=>{const og1=document.createElement('optgroup');og1.label=data.label;const og2=document.createElement('optgroup');og2.label=data.label;Object.entries(data.units).forEach(([id,u])=>{const o1=new Option(u.name,id);const o2=new Option(u.name,id);og1.appendChild(o1);og2.appendChild(o2)});from.appendChild(og1);to.appendChild(og2)});from.value='kg';to.value='lb';}
function convertValue(v,a,b){if(a===b)return v;if(a==='c'){if(b==='f')return v*9/5+32;if(b==='k')return v+273.15}if(a==='f'){if(b==='c')return (v-32)*5/9;if(b==='k')return (v-32)*5/9+273.15}if(a==='k'){if(b==='c')return v-273.15;if(b==='f')return (v-273.15)*9/5+32}const A=byUnit[a],B=byUnit[b];if(!A||!B||A.cat!==B.cat)return NaN;const base=v*A.factor;return base/B.factor}
function fmt(n){if(!Number.isFinite(n))return 'Unavailable';return Number(n.toPrecision(12)).toLocaleString(undefined,{maximumFractionDigits:10})}
function calculate(addToHistory=true){const v=Number(value.value);if(!Number.isFinite(v)||value.value===''){out.textContent='';unit.textContent='';return}const res=convertValue(v,from.value,to.value);out.textContent=fmt(res);unit.textContent=byUnit[to.value]?.name||'';if(addToHistory&&Number.isFinite(res))saveHistory(`${value.value} ${byUnit[from.value].name} → ${byUnit[to.value].name}`,`${fmt(res)} ${byUnit[to.value].name}`)}
function compatible(a,b){if(a===b)return true;if((a==='c'||a==='f'||a==='k')&&(b==='c'||b==='f'||b==='k'))return true;return byUnit[a]?.cat===byUnit[b]?.cat}
function saveHistory(eq,ans){let h=JSON.parse(localStorage.getItem('toolsEtcUnitHistory')||'[]');h.unshift({eq,ans});h=h.slice(0,50);localStorage.setItem('toolsEtcUnitHistory',JSON.stringify(h));renderHistory()}
function renderHistory(){const list=document.getElementById('historyList');const h=JSON.parse(localStorage.getItem('toolsEtcUnitHistory')||'[]');if(!h.length){list.innerHTML='<div class="history-empty">No conversions yet.</div>';return}list.innerHTML=h.map(x=>`<div class="history-item"><div class="history-equation">${escapeHtml(x.eq)}</div><div class="history-answer">= ${escapeHtml(x.ans)}</div></div>`).join('')}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function maybeSetToForFrom(){if(compatible(from.value,to.value))return;const cat=byUnit[from.value]?.cat;const first=Object.keys(UNITS[cat].units).find(id=>id!==from.value);if(first)to.value=first}
addOptions();renderHistory();
from.addEventListener('change',maybeSetToForFrom);
value.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calculate()}});
to.addEventListener('change',()=>{});
document.getElementById('convert').addEventListener('click',()=>calculate(true));
document.getElementById('clearHistory').addEventListener('click',()=>{localStorage.removeItem('toolsEtcUnitHistory');renderHistory()});
calculate(false);
</script>
</body>
