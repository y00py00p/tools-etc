const input=document.getElementById('expressionInput');
const resultEl=document.getElementById('result');
const normalizeInput=v=>v.replace(/[×✕]/g,'x').replace(/[÷]/g,'/').replace(/[−–—]/g,'-').replace(/[^0-9+\-*/xX().\s]/g,'').replace(/X/g,'x');
const gcd=(a,b)=>{a=a<0n?-a:a;b=b<0n?-b:b;while(b!==0n){const t=a%b;a=b;b=t}return a||1n};
const simplify=(n,d)=>{if(d===0n)throw new Error('Cannot divide by zero');if(d<0n){n=-n;d=-d}const g=gcd(n,d);return[n/g,d/g]};

const toDecimal=(n,d)=>{const a=Number(n),b=Number(d);if(!Number.isFinite(a)||!Number.isFinite(b)||b===0)return null;const value=a/b;if(Math.abs(value)>1e15)return null;return value.toPrecision(12).replace(/(?:\.0+|(?<=\.[0-9]*?)0+)$/,'').replace(/\.$/,'')};
function tokenize(expr){
  const s=normalizeInput(expr).replace(/\s+/g,'');
  if(!s) return [];
  const tokens=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/[0-9]/.test(c)){let j=i;while(j<s.length&&/[0-9]/.test(s[j]))j++;tokens.push({type:'num',value:s.slice(i,j)});i=j;continue;}
    if('()+-*/x'.includes(c)){tokens.push({type:'op',value:c});i++;continue;}
    throw new Error('Invalid character');
  }
  return tokens;
}
function parse(tokens){
  let pos=0;
  const peek=()=>tokens[pos];
  const eat=v=>{if(peek()?.value===v){pos++;return true}return false};
  function expression(){let v=term();while(peek()?.type==='op'&&(peek().value==='+'||peek().value==='-')){const op=peek().value;pos++;const r=term();v=op==='+'?[v[0]*r[1]+r[0]*v[1],v[1]*r[1]]:[v[0]*r[1]-r[0]*v[1],v[1]*r[1]];v=simplify(...v)}return v}
  function term(){let v=factor();while(peek()?.type==='op'&&['*','/','x'].includes(peek().value)){const op=peek().value;pos++;const r=factor();if((op==='/'||op==='x')&&r[0]===0n)throw new Error('Cannot divide by zero');v=op==='/'?[v[0]*r[1],v[1]*r[0]]:[v[0]*r[0],v[1]*r[1]];v=simplify(...v)}return v}
  function factor(){if(eat('+'))return factor();if(eat('-')){const v=factor();return[-v[0],v[1]]}if(eat('(')){const v=expression();if(!eat(')'))throw new Error('Missing )');return v}const t=peek();if(!t||t.type!=='num')throw new Error('Incomplete expression');pos++;if(eat('/')){const d=peek();if(!d||d.type!=='num')throw new Error('Enter a denominator');pos++;return simplify(BigInt(t.value),BigInt(d.value))}return[BigInt(t.value),1n]}

}
const HISTORY_KEY='toolsEtc_fraction_history_v1';
const MAX_HISTORY=50;
function loadHistory(){
  try{
    const raw=localStorage.getItem(HISTORY_KEY);
    const parsed=raw?JSON.parse(raw):[];
    return Array.isArray(parsed)?parsed.slice(0,MAX_HISTORY):[];
  }catch{return []}
}
let history=loadHistory();
function saveHistory(){
  try{localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(0,MAX_HISTORY)))}catch{}
}
function escapeHtml(value){
  return String(value).replace(/[&<>\"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[ch]));
}
function renderHistory(){
  const list=document.getElementById('historyList');
  if(!history.length){
    list.innerHTML='<div class="history-empty">No calculations yet.</div>';
    return;
  }
  list.innerHTML=history.map(item=>{
    const mixed=item.mixed&&item.mixed!==item.improper?`<span class="mixed-form">Mixed: ${escapeHtml(item.mixed)}</span>`:'';
    const decimal=item.decimal?`<span class="mixed-form">Decimal: ${escapeHtml(item.decimal)}</span>`:'';

    return `<div class="history-item"><div class="history-equation">${escapeHtml(item.equation)}</div><div class="history-answer"><strong>${escapeHtml(item.improper)}</strong>${mixed}${decimal}</div>${meta}</div>`;
  }).join('');
}
function addHistory(equation,n,d,improper,mixed,decimal){
  const cleanEquation=equation.trim().replace(/\s+/g,' ');
  if(!cleanEquation)return;

  history.unshift(item);
  if(history.length>MAX_HISTORY)history=history.slice(0,MAX_HISTORY);
  saveHistory();
  renderHistory();
}
function calculate(saveToHistory=false){
  const raw=input.value;
  if(!raw.trim()){resultEl.innerHTML='<div class="muted small">Enter an expression</div>';return;}
  try{
    const [n,d]=parse(tokenize(raw));
    const improper=formatImproper(n,d);
    const mixed=formatMixed(n,d);
    const decimal=toDecimal(n,d);
    let html=`<strong>${improper}</strong><div class="muted small">Improper fraction</div>`;
    if(mixed!==improper)html+=`<div class="fraction-forms"><div class="form-line"><span class="form-label">Mixed</span><span class="form-value">${mixed}</span></div></div>`;
    if(decimal!==null&&!/^\-?\d+$/.test(improper))html+=`<div class="decimal muted small">Decimal: ${decimal}</div>`;
    resultEl.innerHTML=html;
    if(saveToHistory)addHistory(raw,n,d,improper,mixed,decimal);
  }catch(e){resultEl.innerHTML=`<strong class="error-text">${e.message}</strong><div class="muted small">Use numbers, +, −, ×, ÷, x, /, and parentheses.</div>`}
}
function insertText(text){
  const el=input;const start=el.selectionStart??el.value.length;const end=el.selectionEnd??el.value.length;el.value=normalizeInput(el.value.slice(0,start)+text+el.value.slice(end));const next=start+text.length;el.setSelectionRange(next,next);el.focus();calculate();
}
input.addEventListener('input',()=>{const cleaned=normalizeInput(input.value);if(cleaned!==input.value){const p=Math.min(input.selectionStart||cleaned.length,cleaned.length);input.value=cleaned;input.setSelectionRange(p,p)}calculate()});
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();calculate(true);return}if(e.key===' '){return}if(e.ctrlKey||e.metaKey||e.altKey)return;if(['Backspace','Delete','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End','Tab'].includes(e.key))return;if(/^[0-9+\-*/().xX]$/.test(e.key))return;e.preventDefault()});
document.querySelectorAll('[data-key]').forEach(btn=>btn.addEventListener('click',()=>{const k=btn.dataset.key;if(k==='clear'){input.value='';input.focus();calculate();return}if(k==='backspace'){const p=input.selectionStart??input.value.length;const q=input.selectionEnd??p;if(p!==q){input.setRangeText('',p,q,'end')}else if(p>0){input.setRangeText('',p-1,p,'end')}input.focus();calculate();return}if(k==='space'){insertText(' ');return}if(k==='equals'){calculate(true);input.focus();return}insertText(k)}));
document.getElementById('clear').onclick=()=>{input.value='';input.focus();calculate()};
document.getElementById('calc').onclick=()=>calculate(true);

input.value='';calculate();
renderHistory();
</script>
