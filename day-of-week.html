<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">
  <meta name="description" content="Find the day of the week for any date with this free online day of the week calculator.">
  <link rel="canonical" href="https://tools-etc.vercel.app/day-of-week">
  <meta property="og:title" content="Day of the Week Calculator | Tools, etc.">
  <meta property="og:description" content="Find the day of the week for any date with this free online calculator.">
  <meta property="og:url" content="https://tools-etc.vercel.app/day-of-week">
  <meta property="og:type" content="website">
  <title>Day of the Week Calculator | Tools, etc.</title>

  <style>
    :root{
      --bg:#f7f7f9;
      --surface:#ffffff;
      --surface-2:#f1f1f5;
      --text:#17171b;
      --muted:#70717a;
      --border:#e6e6eb;
      --accent:#635bff;
      --accent-soft:#eeecff;
      --radius:22px;
      --shadow:0 10px 30px rgba(20,20,30,.06);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    a{color:inherit;text-decoration:none}

    .shell{width:min(900px,calc(100% - 36px));margin:0 auto;padding:24px 0 56px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-left: clamp(2px, calc((100vw - 1132px) / 2), 40px);
      font-weight: 750;
      letter-spacing: -0.03em;
      font-size: 19px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--text);
      color: #fff;
      flex: 0 0 auto;
    }
    .brand-mark svg { width: 18px; height: 18px; }

    .hero{padding:54px 0 28px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(255,255,255,.75);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    h1{
      margin:16px 0 12px;
      font-size:clamp(34px,5vw,54px);
      line-height:1.02;
      letter-spacing:-.055em;
    }
    .hero p{
      max-width:670px;
      margin:0;
      color:var(--muted);
      font-size:16px;
      line-height:1.65;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
    }
    .label{
      display:block;
      margin:0 0 8px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
    }
    .date-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
    .field{
      width:100%;
      min-height:48px;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      outline:none;
    }
    .field:focus{border-color:rgba(99,91,255,.5);box-shadow:0 0 0 4px rgba(99,91,255,.1)}
    .btn{
      min-height:48px;
      padding:12px 16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      font-weight:750;
      cursor:pointer;
    }
    .btn:hover{border-color:rgba(99,91,255,.35)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{filter:brightness(.98)}

    .result{
      margin-top:16px;
      min-height:190px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:28px 20px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-2);
    }
    .result-inner{width:100%}
    .result-kicker{color:var(--muted);font-size:13px;font-weight:700}
    .weekday{
      margin-top:8px;
      font-size:clamp(38px,7vw,62px);
      line-height:1;
      letter-spacing:-.05em;
      font-weight:850;
    }
    .formatted-date{margin-top:10px;color:var(--muted);font-size:14px}
    .empty-state{color:var(--muted);font-size:14px;line-height:1.6}

    .footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}

    @media(max-width:640px){
      .shell{width:min(100% - 22px,1180px);padding-top:14px}
      header{padding-bottom:14px}
      .brand{margin-left:7px}
      .hero{padding:44px 0 26px}
      .date-row{grid-template-columns:1fr}
      .btn{width:100%}
      .card{padding:18px}
    }
  </style>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Tools, etc. homepage">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6" />
            <path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3" />
            <path d="M8.2 15h7.6" />
          </svg>
        </span>
        <span>Tools, etc.</span>
      </a>
    </header>

    <section class="hero">
      <span class="eyebrow">Tools, etc.</span>
      <h1>Day of the Week</h1>
      <p>Enter a date to find out exactly which day of the week it falls on.</p>
    </section>

    <main class="card">
      <div class="date-row">
        <div>
          <label class="label" for="dateInput">Date</label>
          <input id="dateInput" class="field" type="date" aria-describedby="dateHelp">
          <div id="dateHelp" class="footer-note">Your date stays in your browser.</div>
        </div>
        <button id="clearButton" class="btn" type="button">Clear</button>
      </div>

      <section id="result" class="result" aria-live="polite">
        <div id="emptyState" class="empty-state">Choose a date to see the day of the week.</div>
        <div id="resultInner" class="result-inner" hidden>
          <div class="result-kicker">That date falls on</div>
          <div id="weekday" class="weekday"></div>
          <div id="formattedDate" class="formatted-date"></div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function(){
      "use strict";

      const dateInput = document.getElementById("dateInput");
      const clearButton = document.getElementById("clearButton");
      const emptyState = document.getElementById("emptyState");
      const resultInner = document.getElementById("resultInner");
      const weekday = document.getElementById("weekday");
      const formattedDate = document.getElementById("formattedDate");

      const weekdays = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
      ];

      function parseDateInput(value){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        const [year, month, day] = value.split("-").map(Number);
        const date = new Date(Date.UTC(year, month - 1, day));
        if(
          date.getUTCFullYear() !== year ||
          date.getUTCMonth() !== month - 1 ||
          date.getUTCDate() !== day
        ) return null;
        return date;
      }

      function showResult(){
        const date = parseDateInput(dateInput.value);
        if(!date){
          emptyState.hidden = false;
          resultInner.hidden = true;
          return;
        }

        weekday.textContent = weekdays[date.getUTCDay()];
        formattedDate.textContent = new Intl.DateTimeFormat(undefined, {
          timeZone: "UTC",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);

        emptyState.hidden = true;
        resultInner.hidden = false;
      }

      dateInput.addEventListener("input", showResult);
      dateInput.addEventListener("change", showResult);
      clearButton.addEventListener("click", function(){
        dateInput.value = "";
        dateInput.focus();
        showResult();
      });

      showResult();
    })();
  </script>
</body>
</html>
