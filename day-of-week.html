<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta content="#635bff" name="theme-color"/>
<meta content="Find the day of the week for any date with this free online day of the week calculator." name="description"/>
<link href="https://tools-etc.vercel.app/day-of-week" rel="canonical"/>
<meta content="Day of the Week Calculator | Tools etc." property="og:title"/>
<meta content="Find the day of the week for any date with this free online calculator." property="og:description"/>

<meta content="website" property="og:type"/>
<title>Day of the Week Calculator | Tools etc.</title>
<style>
    :root{
      --bg:#f7f7f9;
      --surface:#ffffff;
      --surface-2:#f1f1f5;
      --text:#17171b;
      --muted:#70717a;
      --border:#e6e6eb;
      --accent:#635bff;
      --accent-soft:#eeecff;
      --radius:22px;
      --shadow:0 10px 30px rgba(20,20,30,.06);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      background:radial-gradient(circle at 50% -10%,rgba(99,91,255,.08),transparent 34%),var(--bg);
      color:var(--text);
      font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    button,input{font:inherit}
    a{color:inherit;text-decoration:none}

    .shell{width:min(900px,calc(100% - 36px));margin:0 auto;padding:24px 0 56px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-left: clamp(2px, calc((100vw - 1132px) / 2), 40px);
      font-weight: 750;
      letter-spacing: -0.03em;
      font-size: 19px;
    }
    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--text);
      color: #fff;
      flex: 0 0 auto;
    }
    .brand-mark svg { width: 18px; height: 18px; }

    .hero{padding:54px 0 28px}
    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:7px 10px;
      border:1px solid var(--border);
      border-radius:999px;
      background:rgba(255,255,255,.75);
      color:var(--muted);
      font-size:12px;
      font-weight:700;
    }
    h1{
      margin:16px 0 12px;
      font-size:clamp(34px,5vw,54px);
      line-height:1.02;
      letter-spacing:-.055em;
    }
    .hero p{
      max-width:670px;
      margin:0;
      color:var(--muted);
      font-size:16px;
      line-height:1.65;
    }

    .card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:24px;
    }
    .label{
      display:block;
      margin:0 0 8px;
      color:var(--muted);
      font-size:12px;
      font-weight:750;
    }
    .date-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
    .field{
      width:100%;
      min-height:48px;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      outline:none;
    }
    .field:focus{border-color:rgba(99,91,255,.5);box-shadow:0 0 0 4px rgba(99,91,255,.1)}
    .btn{
      min-height:48px;
      padding:12px 16px;
      border:1px solid var(--border);
      border-radius:14px;
      background:var(--surface);
      color:var(--text);
      font-weight:750;
      cursor:pointer;
    }
    .btn:hover{border-color:rgba(99,91,255,.35)}
    .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn.primary:hover{filter:brightness(.98)}

    .result{
      margin-top:16px;
      min-height:190px;
      display:grid;
      place-items:center;
      text-align:center;
      padding:28px 20px;
      border:1px solid var(--border);
      border-radius:18px;
      background:var(--surface-2);
    }
    .result-inner{width:100%}
    .result-kicker{color:var(--muted);font-size:13px;font-weight:700}
    .weekday{
      margin-top:8px;
      font-size:clamp(38px,7vw,62px);
      line-height:1;
      letter-spacing:-.05em;
      font-weight:850;
    }
    .formatted-date{margin-top:10px;color:var(--muted);font-size:14px}
    .empty-state{color:var(--muted);font-size:14px;line-height:1.6}

    .footer-note{margin-top:18px;color:var(--muted);font-size:12px;line-height:1.5}

    @media(max-width:640px){
      .shell{width:min(100% - 22px,1180px);padding-top:14px}
      header{padding-bottom:14px}
      .brand{margin-left:7px}
      .hero{padding:44px 0 26px}
      .date-row{grid-template-columns:1fr}
      .btn{width:100%}
      .card{padding:18px}
    }
  

/* Tools etc. shared page chrome */
header.site-header{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:20px!important;padding:8px 0 24px!important;margin:0!important;width:min(1180px,calc(100vw - 32px))!important;position:relative!important;left:50%!important;transform:translateX(-50%)!important}
header.site-header .brand{display:inline-flex!important;align-items:center!important;gap:11px!important;margin:0!important;font-family:inherit!important;font-size:19px!important;font-weight:750!important;letter-spacing:-.03em!important;line-height:1.2!important;white-space:nowrap!important;text-decoration:none!important}
header.site-header .brand-mark{width:34px!important;height:34px!important;display:grid!important;place-items:center!important;border-radius:10px!important;background:var(--text)!important;color:#fff!important;flex:0 0 auto!important;box-shadow:none!important}
header.site-header .brand-mark svg{width:18px!important;height:18px!important}
header.site-header .back{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:7px!important;padding:10px 12px!important;border:1px solid var(--border)!important;border-radius:10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:14px!important;font-weight:650!important;line-height:1.2!important;text-decoration:none!important;white-space:nowrap!important}
header.site-header .back:hover,header.site-header .back:focus-visible{background:var(--surface)!important;color:var(--text)!important;outline:none!important}
header.site-header .back svg{display:block!important;width:16px!important;height:16px!important;flex:0 0 auto!important;transform:none!important}
.hero{padding:34px 0 24px!important;text-align:center!important}
.hero h1,h1{margin:0!important;font-family:inherit!important;font-size:clamp(34px,5.5vw,54px)!important;line-height:1!important;letter-spacing:-.05em!important;font-weight:800!important}
button{font-family:inherit}
@media(max-width:620px){header.site-header{padding:4px 0 18px!important}header.site-header .brand{margin:0!important;font-size:18px!important}header.site-header .back{font-size:14px!important;padding:9px 10px!important}.hero{padding:28px 0 20px!important}}

/* Shared history controls */
.history-head button{appearance:none!important;border:1px solid var(--border)!important;border-radius:10px!important;padding:8px 10px!important;background:transparent!important;color:var(--muted)!important;font-family:inherit!important;font-size:12px!important;font-weight:700!important;line-height:1.2!important;cursor:pointer!important;transition:background .16s ease,color .16s ease,border-color .16s ease!important}
.history-head button:hover,.history-head button:focus-visible{background:var(--surface2)!important;color:var(--text)!important;outline:none!important}
</style>

  </script>

</head>
<body>
<div class="shell">
<header class="site-header"><a aria-label="Tools etc. home" class="brand" href="/"><span aria-hidden="true" class="brand-mark"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M9 3h6"></path><path d="M10 3v5l-5.2 9.1A2.6 2.6 0 0 0 7.05 21h9.9a2.6 2.6 0 0 0 2.25-3.9L14 8V3"></path><path d="M8.2 15h7.6"></path></svg></span><span>Tools etc.</span></a><a aria-label="All tools" class="back" href="/"><span>All tools</span><svg aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24"><path d="M5 12h14"></path><path d="m13 6 6 6-6 6"></path></svg></a></header>
<section class="hero">

<h1>Day of the Week</h1>

</section>
<main class="card">
<div class="date-row">
<div>
<label class="label" for="dateInput">Date</label>
<input class="field" id="dateInput" type="date"/>

</div>
<button class="btn" id="clearButton" type="button">Clear</button>
</div>
<section aria-live="polite" class="result" id="result">
<div class="empty-state" id="emptyState">Choose a date to see the day of the week.</div>
<div class="result-inner" hidden="" id="resultInner">
<div class="result-kicker">That date falls on</div>
<div class="weekday" id="weekday"></div>
<div class="formatted-date" id="formattedDate"></div>
</div>
</section>
</main>
</div>
<script>
    (function(){
      "use strict";

      const dateInput = document.getElementById("dateInput");
      const clearButton = document.getElementById("clearButton");
      const emptyState = document.getElementById("emptyState");
      const resultInner = document.getElementById("resultInner");
      const weekday = document.getElementById("weekday");
      const formattedDate = document.getElementById("formattedDate");

      const weekdays = [
        "Sunday", "Monday", "Tuesday", "Wednesday",
        "Thursday", "Friday", "Saturday"
      ];

      function parseDateInput(value){
        if(!/^\d{4}-\d{2}-\d{2}$/.test(value)) return null;
        const [year, month, day] = value.split("-").map(Number);
        const date = new Date(Date.UTC(year, month - 1, day));
        if(
          date.getUTCFullYear() !== year ||
          date.getUTCMonth() !== month - 1 ||
          date.getUTCDate() !== day
        ) return null;
        return date;
      }

      function showResult(){
        const date = parseDateInput(dateInput.value);
        if(!date){
          emptyState.hidden = false;
          resultInner.hidden = true;
          return;
        }

        weekday.textContent = weekdays[date.getUTCDay()];
        formattedDate.textContent = new Intl.DateTimeFormat(undefined, {
          timeZone: "UTC",
          year: "numeric",
          month: "long",
          day: "numeric"
        }).format(date);

        emptyState.hidden = true;
        resultInner.hidden = false;
      }

      dateInput.addEventListener("input", showResult);
      dateInput.addEventListener("change", showResult);
      clearButton.addEventListener("click", function(){
        dateInput.value = "";
        dateInput.focus();
        showResult();
      });

      showResult();
    })();
  </script>
</body>
</html>
